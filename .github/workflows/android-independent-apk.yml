name: SOW IA independent Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-independent-apk:
    name: Build independently signed SOW IA APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare the new independent signing key
        env:
          SOWIA_PREVIEW_KEYSTORE_BASE64: ${{ secrets.SOWIA_PREVIEW_KEYSTORE_BASE64 }}
          SOWIA_PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.SOWIA_PREVIEW_KEYSTORE_PASSWORD }}
          SOWIA_PREVIEW_KEY_ALIAS: ${{ secrets.SOWIA_PREVIEW_KEY_ALIAS }}
          SOWIA_PREVIEW_KEY_PASSWORD: ${{ secrets.SOWIA_PREVIEW_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in SOWIA_PREVIEW_KEYSTORE_BASE64 SOWIA_PREVIEW_KEYSTORE_PASSWORD SOWIA_PREVIEW_KEY_ALIAS SOWIA_PREVIEW_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done
          KEYSTORE="$RUNNER_TEMP/sowia-independent-release.jks"
          printf '%s' "$SOWIA_PREVIEW_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storetype JKS \
            -storepass "$SOWIA_PREVIEW_KEYSTORE_PASSWORD" \
            -alias "$SOWIA_PREVIEW_KEY_ALIAS" >/dev/null
          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE"
            echo "ANDROID_KEYSTORE_TYPE=JKS"
            echo "ANDROID_KEYSTORE_PASSWORD=$SOWIA_PREVIEW_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$SOWIA_PREVIEW_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$SOWIA_PREVIEW_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "New independent signing key decoded and verified."

      - name: Validate Supabase configuration
        env:
          SOWIA_SUPABASE_URL: ${{ secrets.SOWIA_SUPABASE_URL }}
          SOWIA_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SOWIA_SUPABASE_PUBLISHABLE_KEY }}
          SOWIA_SUPABASE_ANON_KEY: ${{ secrets.SOWIA_SUPABASE_ANON_KEY }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          value = os.environ.get("SOWIA_SUPABASE_URL", "").strip()
          key = (os.environ.get("SOWIA_SUPABASE_PUBLISHABLE_KEY", "").strip()
                 or os.environ.get("SOWIA_SUPABASE_ANON_KEY", "").strip())
          parsed = urlparse(value)
          if parsed.scheme != "https" or parsed.hostname != "qegcopordeqjiechmbhg.supabase.co" or parsed.path not in ("", "/") or parsed.query or parsed.fragment:
              raise SystemExit("SOWIA_SUPABASE_URL must be the project root HTTPS URL.")
          if not key:
              raise SystemExit("Supabase publishable/anon key is missing.")
          print("Supabase configuration validated.")
          PY

      - name: Build signed independent APK
        run: gradle -p android :app:assembleLegacyRelease

      - name: Verify APK signature and package identity
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/legacy/release -maxdepth 1 -name '*.apk' -print -quit)"
          if [[ -z "$APK" ]]; then
            echo "::error::Legacy release APK was not produced."
            exit 1
          fi
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$APKSIGNER" ]]; then
            echo "::error::Android apksigner was not found."
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.sowkeys.sowia.parallel'"
          mkdir -p release-output
          cp "$APK" release-output/SOWIA-independent.apk
          cat > release-output/INSTALLATION.txt <<'EOF'
          SOW IA — version Android indépendante
          Identifiant : com.sowkeys.sowia.parallel
          Signature : clé indépendante Sowkeys (pas le certificat Google Play)
          Installation : ouvrir le fichier APK sur Android et autoriser l'installation depuis cette source si Android le demande.
          Cette version s'installe séparément de l'application Google Play.
          EOF

      - name: Upload signed independent APK
        uses: actions/upload-artifact@v4
        with:
          name: sowia-independent-signed-apk
          path: release-output/*
          if-no-files-found: error
          retention-days: 30
