name: SOW IA Android new Play listing AAB

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/android-new-play-release.yml"

permissions:
  contents: read

jobs:
  bundle-new-play-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Validate and prepare the new listing upload key
        env:
          NEW_KEYSTORE_BASE64: ${{ secrets.SOWIA_NEW_UPLOAD_KEYSTORE_BASE64 }}
          NEW_KEYSTORE_PASSWORD: ${{ secrets.SOWIA_NEW_UPLOAD_KEYSTORE_PASSWORD }}
          NEW_KEY_ALIAS: ${{ secrets.SOWIA_NEW_UPLOAD_KEY_ALIAS }}
          NEW_KEY_PASSWORD: ${{ secrets.SOWIA_NEW_UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in NEW_KEYSTORE_BASE64 NEW_KEYSTORE_PASSWORD NEW_KEY_ALIAS NEW_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required new-listing signing secret $name is missing. No signing key will be generated or replaced."
              exit 1
            fi
          done

          KEYSTORE_PATH="$RUNNER_TEMP/sowia-new-play-upload.jks"
          export NEW_KEYSTORE_BASE64 KEYSTORE_PATH
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          raw = base64.b64decode("".join(os.environ["NEW_KEYSTORE_BASE64"].split()), validate=True)
          if not raw:
              raise SystemExit("The new upload keystore is empty.")
          Path(os.environ["KEYSTORE_PATH"]).write_bytes(raw)
          print("New listing upload keystore decoded.")
          PY

          keytool -list -storetype JKS -keystore "$KEYSTORE_PATH" -storepass "$NEW_KEYSTORE_PASSWORD" -alias "$NEW_KEY_ALIAS" >/dev/null
          python3 - <<'PY'
          from zipfile import ZipFile
          with ZipFile("signing-probe.jar", "w"):
              pass
          PY
          jarsigner -keystore "$KEYSTORE_PATH" -storetype JKS -storepass "$NEW_KEYSTORE_PASSWORD" -keypass "$NEW_KEY_PASSWORD" signing-probe.jar "$NEW_KEY_ALIAS" >/dev/null
          rm -f signing-probe.jar

          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "ANDROID_KEYSTORE_TYPE=JKS"
            echo "ANDROID_KEYSTORE_PASSWORD=$NEW_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$NEW_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$NEW_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "New listing upload key and private-key access verified."

      - name: Validate Supabase configuration and build the new listing AAB
        env:
          SOWIA_SUPABASE_URL: ${{ secrets.SOWIA_SUPABASE_URL }}
          SOWIA_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SOWIA_SUPABASE_PUBLISHABLE_KEY }}
          SOWIA_SUPABASE_ANON_KEY: ${{ secrets.SOWIA_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          value = os.environ.get("SOWIA_SUPABASE_URL", "").strip()
          key = (os.environ.get("SOWIA_SUPABASE_PUBLISHABLE_KEY", "").strip()
                 or os.environ.get("SOWIA_SUPABASE_ANON_KEY", "").strip())
          parsed = urlparse(value)
          if parsed.scheme != "https" or parsed.hostname != "qegcopordeqjiechmbhg.supabase.co" or parsed.path not in ("", "/") or parsed.query or parsed.fragment:
              raise SystemExit("SOWIA_SUPABASE_URL must be the configured project root HTTPS URL.")
          if not key:
              raise SystemExit("A Supabase publishable/anon key is missing.")
          print("Existing SOW IA Supabase backend configuration validated.")
          PY
          gradle -p android :app:bundlePlayNewRelease

      - name: Verify and publish signed AAB artifact
        run: |
          set -euo pipefail
          AAB="$(find android/app/build/outputs/bundle/playNewRelease -maxdepth 1 -name '*.aab' -print -quit)"
          if [ -z "$AAB" ]; then
            echo "::error::The new-listing release AAB was not produced."
            exit 1
          fi
          jarsigner -verify "$AAB" > "$RUNNER_TEMP/aab-signature-check.txt" 2>&1
          if ! grep -qi "jar verified" "$RUNNER_TEMP/aab-signature-check.txt"; then
            cat "$RUNNER_TEMP/aab-signature-check.txt"
            echo "::error::The new-listing AAB signature could not be verified."
            exit 1
          fi
          mkdir -p release-output
          cp "$AAB" release-output/SOWIA-new-play-listing-release.aab
          echo "Signed new-listing AAB verified."

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: sowia-new-play-listing-release-aab
          path: release-output/SOWIA-new-play-listing-release.aab
          if-no-files-found: error
          retention-days: 14
