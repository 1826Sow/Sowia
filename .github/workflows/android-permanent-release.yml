name: SOW IA Android permanent signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - android/sowia-permanent-signing-20261121
    paths:
      - '.github/workflows/android-permanent-release.yml'
      - 'android/**'

permissions:
  contents: read

jobs:
  build-release:
    name: Build and verify permanent signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK and install required tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::Android SDK command-line tools are missing."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore permanent signing key securely
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_TYPE: ${{ secrets.ANDROID_KEYSTORE_TYPE }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          KEYSTORE="$RUNNER_TEMP/sowia-release-permanent.jks"
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"; then
            echo "::error::Keystore secret is not valid Base64."
            exit 1
          fi
          if [[ ! -s "$KEYSTORE" ]]; then
            echo "::error::Decoded keystore file is empty."
            exit 1
          fi
          # Respect an explicitly configured type. If it is unset, detect the
          # original keystore format without exposing passwords or key material.
          if [[ -n "${ANDROID_KEYSTORE_TYPE:-}" ]]; then
            KEYSTORE_TYPES=("$ANDROID_KEYSTORE_TYPE")
          else
            KEYSTORE_TYPES=("JKS" "PKCS12")
          fi
          KEYSTORE_TYPE=""
          KEYTOOL_OUTPUT=""
          for candidate in "${KEYSTORE_TYPES[@]}"; do
            if KEYTOOL_OUTPUT="$(keytool -list -keystore "$KEYSTORE" -storetype "$candidate" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" 2>&1)"; then
              KEYSTORE_TYPE="$candidate"
              break
            fi
          done
          if [[ -z "$KEYSTORE_TYPE" ]]; then
            echo "::error::Keystore validation failed for the configured or detected formats. No secret values are printed."
            printf '%s\\n' "$KEYTOOL_OUTPUT" | sed -E 's/(password|secret|key)[^:]*:.*/\\1: [masqué]/Ig'
            exit 1
          fi
          echo "Keystore format validated: $KEYSTORE_TYPE."
          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE"
            echo "ANDROID_KEYSTORE_TYPE=${ANDROID_KEYSTORE_TYPE:-JKS}"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Permanent signing key restored and validated."

      - name: Validate Supabase public build configuration
        env:
          SOWIA_SUPABASE_URL: ${{ secrets.SOWIA_SUPABASE_URL }}
          SOWIA_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SOWIA_SUPABASE_PUBLISHABLE_KEY }}
          SOWIA_SUPABASE_ANON_KEY: ${{ secrets.SOWIA_SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          u = urlparse(os.environ.get("SOWIA_SUPABASE_URL", "").strip())
          k = (os.environ.get("SOWIA_SUPABASE_PUBLISHABLE_KEY", "").strip()
               or os.environ.get("SOWIA_SUPABASE_ANON_KEY", "").strip())
          if u.scheme != "https" or u.hostname != "qegcopordeqjiechmbhg.supabase.co" or u.path not in ("", "/") or u.query or u.fragment:
              raise SystemExit("Missing or invalid SOWIA_SUPABASE_URL secret.")
          if not k:
              raise SystemExit("Missing Supabase public/anon key secret.")
          print("Supabase public build configuration is present.")
          PY

      - name: Build release APK
        env:
          SOWIA_SUPABASE_URL: ${{ secrets.SOWIA_SUPABASE_URL }}
          SOWIA_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SOWIA_SUPABASE_PUBLISHABLE_KEY }}
          SOWIA_SUPABASE_ANON_KEY: ${{ secrets.SOWIA_SUPABASE_ANON_KEY }}
        run: gradle -p android :app:assembleCurrentRelease

      - name: Verify package, signature and certificate fingerprint
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk -type f -path '*/current/release/*.apk' -print -quit)"
          if [[ -z "$APK" ]]; then
            echo "::error::Release APK not found."
            exit 1
          fi
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/sowia-signature.txt"
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" "$RUNNER_TEMP/sowia-signature.txt"
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" "$RUNNER_TEMP/sowia-signature.txt"
          PACKAGE_ID="$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          if [[ "$PACKAGE_ID" != "com.sowkeys.sowia" ]]; then
            echo "::error::Unexpected application ID: $PACKAGE_ID"
            exit 1
          fi
          mkdir -p release-output
          cp "$APK" release-output/SOW-IA-Android-permanent.apk
          sha256sum release-output/SOW-IA-Android-permanent.apk | tee release-output/SHA256SUMS.txt
          echo "Release APK package ID and v2/v3 signatures verified."

      - name: Upload permanent signed APK
        uses: actions/upload-artifact@v4
        with:
          name: sowia-android-permanent-signed
          path: release-output/*
          if-no-files-found: error
          retention-days: 30
