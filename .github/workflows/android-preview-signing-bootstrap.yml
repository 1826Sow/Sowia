name: Prepare Android preview signing key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-preview-signing:
    name: Generate and verify preview signing key
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate and verify stable preview keystore
        env:
          ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          ANDROID_DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
          ANDROID_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_DEBUG_KEYSTORE_PASSWORD ANDROID_DEBUG_KEY_ALIAS ANDROID_DEBUG_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

          KEYSTORE="$RUNNER_TEMP/sowia-preview.keystore"
          BASE64_FILE="$RUNNER_TEMP/ANDROID_DEBUG_KEYSTORE_BASE64.txt"
          VERIFY_FILE="$RUNNER_TEMP/sowia-preview-verify.keystore"

          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE" \
            -storetype JKS \
            -storepass "$ANDROID_DEBUG_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_DEBUG_KEY_PASSWORD" \
            -alias "$ANDROID_DEBUG_KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=SOW IA Preview, OU=Sowkeys, O=Sowkeys, L=Paris, ST=Ile-de-France, C=FR"

          keytool -list -keystore "$KEYSTORE" -storetype JKS -storepass "$ANDROID_DEBUG_KEYSTORE_PASSWORD" -alias "$ANDROID_DEBUG_KEY_ALIAS" >/dev/null
          base64 -w 0 "$KEYSTORE" > "$BASE64_FILE"
          base64 --decode "$BASE64_FILE" > "$VERIFY_FILE"
          keytool -list -keystore "$VERIFY_FILE" -storetype JKS -storepass "$ANDROID_DEBUG_KEYSTORE_PASSWORD" -alias "$ANDROID_DEBUG_KEY_ALIAS" >/dev/null
          echo "Preview keystore generated and verified. Base64 file is ready as a workflow artifact."

      - name: Upload Base64 secret value
        uses: actions/upload-artifact@v4
        with:
          name: sowia-preview-signing-bootstrap
          path: ${{ runner.temp }}/ANDROID_DEBUG_KEYSTORE_BASE64.txt
          if-no-files-found: error
          retention-days: 3
