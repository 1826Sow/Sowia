name: SOW IA Android preview APK (independent v2/v3 signing)

on:
  workflow_dispatch:
  push:
    branches:
      - android/sowia-independent-shell-20261121
    paths:
      - '.github/workflows/android-preview-v2v3.yml'
      - 'android/**'

permissions:
  contents: read

jobs:
  build-preview:
    name: Build and verify independently signed Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated Android branch
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate runner Android SDK and install required tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::Android SDK command-line tools are not installed on this runner."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Create one-run preview signing key
        shell: bash
        run: |
          set -euo pipefail
          PREVIEW_STORE_PASSWORD="$(openssl rand -hex 24)"
          PREVIEW_KEY_PASSWORD="$(openssl rand -hex 24)"
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/sowia-preview.keystore" \
            -storetype JKS \
            -storepass "$PREVIEW_STORE_PASSWORD" \
            -keypass "$PREVIEW_KEY_PASSWORD" \
            -alias sowia-preview \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=SOW IA Preview, OU=Sowkeys, O=Sowkeys, C=FR"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/sowia-preview.keystore"
            echo "ANDROID_KEYSTORE_TYPE=JKS"
            echo "ANDROID_KEYSTORE_PASSWORD=$PREVIEW_STORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=sowia-preview"
            echo "ANDROID_KEY_PASSWORD=$PREVIEW_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Validate public Supabase build configuration
        env:
          SOWIA_SUPABASE_URL: ${{ secrets.SOWIA_SUPABASE_URL }}
          SOWIA_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SOWIA_SUPABASE_PUBLISHABLE_KEY }}
          SOWIA_SUPABASE_ANON_KEY: ${{ secrets.SOWIA_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          u = urlparse(os.environ.get("SOWIA_SUPABASE_URL", "").strip())
          k = (os.environ.get("SOWIA_SUPABASE_PUBLISHABLE_KEY", "").strip()
               or os.environ.get("SOWIA_SUPABASE_ANON_KEY", "").strip())
          if u.scheme != "https" or u.hostname != "qegcopordeqjiechmbhg.supabase.co" or u.path not in ("", "/") or u.query or u.fragment:
              raise SystemExit("Missing or invalid SOWIA_SUPABASE_URL secret.")
          if not k:
              raise SystemExit("Missing Supabase public/anon key secret.")
          print("Supabase public configuration is present.")
          PY

      - name: Build current release APK with preview key
        env:
          SOWIA_SUPABASE_URL: ${{ secrets.SOWIA_SUPABASE_URL }}
          SOWIA_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SOWIA_SUPABASE_PUBLISHABLE_KEY }}
          SOWIA_SUPABASE_ANON_KEY: ${{ secrets.SOWIA_SUPABASE_ANON_KEY }}
        run: gradle -p android :app:assembleCurrentRelease

      - name: Verify APK package and Android v1/v2/v3 signatures
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk -type f -path '*/current/release/*.apk' -print -quit)"
          if [[ -z "$APK" ]]; then
            echo "::error::Current release APK was not produced."
            exit 1
          fi
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer 2>/dev/null | sort -V | tail -n 1)"
          if [[ ! -x "$APKSIGNER" ]]; then
            echo "::error::apksigner is unavailable."
            exit 1
          fi
          # Re-sign the release APK explicitly with v1, v2 and v3 enabled.
          "$APKSIGNER" sign \
            --ks "$ANDROID_KEYSTORE_PATH" \
            --ks-type "$ANDROID_KEYSTORE_TYPE" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "env:ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "env:ANDROID_KEY_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$RUNNER_TEMP/SOW-IA-Android-preview-v2v3.apk" \
            "$APK"
          APK="$RUNNER_TEMP/SOW-IA-Android-preview-v2v3.apk"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/sowia-apk-signature.txt"
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" "$RUNNER_TEMP/sowia-apk-signature.txt"
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" "$RUNNER_TEMP/sowia-apk-signature.txt"
          if [[ -n "$APKANALYZER" && -x "$APKANALYZER" ]]; then
            PACKAGE_ID="$("$APKANALYZER" manifest application-id "$APK")"
          else
            AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
            PACKAGE_ID="$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          fi
          if [[ "$PACKAGE_ID" != "com.sowkeys.sowia" ]]; then
            echo "::error::Unexpected application ID: $PACKAGE_ID"
            exit 1
          fi
          mkdir -p release-output
          cp "$APK" release-output/SOW-IA-Android-preview-v2v3.apk
          sha256sum release-output/SOW-IA-Android-preview-v2v3.apk | tee release-output/SHA256SUMS.txt
          echo "Preview APK passed v2/v3 signature verification and package ID validation."

      - name: Upload verified preview APK
        uses: actions/upload-artifact@v4
        with:
          name: sowia-android-preview-v2v3
          path: release-output/*
          if-no-files-found: error
          retention-days: 14
