name: SOW IA Android private test APK
# Builds the current Android app, verifies its package, and publishes a clearly labelled test release.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-private-test-apk.yml'
      - 'android/**'

permissions:
  contents: write

jobs:
  build-test-apk:
    name: Build and publish Android test APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build current Android debug APK
        run: gradle -p android :app:assembleCurrentDebug

      - name: Verify package and APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk -type f -path '*/current/debug/*.apk' -print -quit)"
          if [[ -z "$APK" ]]; then
            echo "::error::Current-flavor debug APK was not produced."
            exit 1
          fi
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          if [[ -z "$AAPT" ]]; then
            echo "::error::Android aapt tool is unavailable."
            exit 1
          fi
          PACKAGE_ID="$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          if [[ "$PACKAGE_ID" != "com.sowkeys.sowia" ]]; then
            echo "::error::Unexpected Android application ID: $PACKAGE_ID"
            exit 1
          fi
          mkdir -p release-output
          cp "$APK" release-output/SOW-IA-Android-TEST.apk
          sha256sum release-output/SOW-IA-Android-TEST.apk | tee release-output/SHA256SUMS.txt
          echo "Debug APK package ID verified. This is a test build, not a Play Store release."

      - name: Upload temporary workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sowia-android-private-test-apk
          path: release-output/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish public test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="sowia-android-test"
          TITLE="SOW IA Android — version de test"
          NOTES="Version Android de test distribuée gratuitement. Cette compilation utilise une signature de débogage et peut nécessiter la désinstallation d'une version signée différemment. Ce n'est pas une publication Google Play."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-output/SOW-IA-Android-TEST.apk release-output/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" release-output/SOW-IA-Android-TEST.apk release-output/SHA256SUMS.txt --title "$TITLE" --notes "$NOTES" --prerelease
          fi

# The stable public asset URL remains the same when the test APK is rebuilt.
