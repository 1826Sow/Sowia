name: SOW IA Android private test APK
# Builds both Android identities from the latest main source, including the PDF picker fixes.
# The legacy applicationId allows side-by-side testing without replacing the installed app.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-private-test-apk.yml'
      - 'android/**'

permissions:
  contents: write

jobs:
  build-test-apk:
    name: Build and publish Android test APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Validate public Supabase build configuration
        env:
          SOWIA_SUPABASE_URL: ${{ secrets.SOWIA_SUPABASE_URL }}
          SOWIA_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SOWIA_SUPABASE_PUBLISHABLE_KEY }}
          SOWIA_SUPABASE_ANON_KEY: ${{ secrets.SOWIA_SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os
          from urllib.parse import urlparse
          u = urlparse(os.environ.get("SOWIA_SUPABASE_URL", "").strip())
          k = (os.environ.get("SOWIA_SUPABASE_PUBLISHABLE_KEY", "").strip()
               or os.environ.get("SOWIA_SUPABASE_ANON_KEY", "").strip())
          if u.scheme != "https" or u.hostname != "qegcopordeqjiechmbhg.supabase.co" or u.path not in ("", "/") or u.query or u.fragment:
              raise SystemExit("Missing or invalid Supabase project URL.")
          if not k:
              raise SystemExit("Missing Supabase public/anon key.")
          if k.startswith("sb_secret_"):
              raise SystemExit("A server secret key cannot be embedded in the APK.")
          if k.count(".") == 2:
              try:
                  part = k.split(".")[1]
                  claims = json.loads(base64.urlsafe_b64decode(part + "=" * (-len(part) % 4)))
              except Exception:
                  claims = {}
              if isinstance(claims, dict) and claims.get("role") == "service_role":
                  raise SystemExit("A service_role key cannot be embedded in the APK.")
          print("Supabase public build configuration validated.")
          PY

      - name: Build both Android debug APKs
        env:
          SOWIA_SUPABASE_URL: ${{ secrets.SOWIA_SUPABASE_URL }}
          SOWIA_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SOWIA_SUPABASE_PUBLISHABLE_KEY }}
          SOWIA_SUPABASE_ANON_KEY: ${{ secrets.SOWIA_SUPABASE_ANON_KEY }}
        run: gradle -p android :app:assembleCurrentDebug :app:assembleLegacyDebug

      - name: Verify packages and APKs
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          if [[ -z "$AAPT" ]]; then
            echo "::error::Android aapt tool is unavailable."
            exit 1
          fi

          CURRENT_APK="$(find android/app/build/outputs/apk -type f -path '*/current/debug/*.apk' -print -quit)"
          LEGACY_APK="$(find android/app/build/outputs/apk -type f -path '*/legacy/debug/*.apk' -print -quit)"
          [[ -n "$CURRENT_APK" ]] || { echo "::error::Current APK missing."; exit 1; }
          [[ -n "$LEGACY_APK" ]] || { echo "::error::Legacy APK missing."; exit 1; }

          CURRENT_ID="$("$AAPT" dump badging "$CURRENT_APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          LEGACY_ID="$("$AAPT" dump badging "$LEGACY_APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          [[ "$CURRENT_ID" == "com.sowkeys.sowia" ]] || { echo "::error::Unexpected current package: $CURRENT_ID"; exit 1; }
          [[ "$LEGACY_ID" == "com.sowkeys.sowia.parallel" ]] || { echo "::error::Unexpected side-by-side package: $LEGACY_ID"; exit 1; }

          mkdir -p release-output
          cp "$CURRENT_APK" release-output/SOW-IA-Android-TEST-UPDATE.apk
          cp "$LEGACY_APK" release-output/SOW-IA-Android-TEST-SIDEBY-SIDE.apk
          sha256sum release-output/*.apk | tee release-output/SHA256SUMS.txt
          echo "Both APKs built and package IDs verified. The side-by-side APK uses a distinct application ID."

      - name: Upload temporary workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sowia-android-private-test-apks
          path: release-output/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish public test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="sowia-android-test"
          TITLE="SOW IA Android — versions de test"
          NOTES="Deux APK de test gratuits : UPDATE conserve le package com.sowkeys.sowia mais sa signature debug ne remplace pas une installation signée différemment. SIDEBY-SIDE utilise le package distinct com.sowkeys.sowia.parallel pour tester sans remplacer l'application principale. Ce ne sont pas des publications Google Play."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-output/SOW-IA-Android-TEST-UPDATE.apk release-output/SOW-IA-Android-TEST-SIDEBY-SIDE.apk release-output/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" release-output/SOW-IA-Android-TEST-UPDATE.apk release-output/SOW-IA-Android-TEST-SIDEBY-SIDE.apk release-output/SHA256SUMS.txt --title "$TITLE" --notes "$NOTES" --prerelease
          fi
