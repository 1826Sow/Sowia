name: SOW IA Android release AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-release-aab.yml'

permissions:
  contents: read

jobs:
  bundle-current-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Validate and prepare the existing Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.SOWIA_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SOWIA_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.SOWIA_UPLOAD_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.SOWIA_UPLOAD_KEY_PASSWORD }}
          ANDROID_KEYSTORE_TYPE: JKS
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required signing secret $name is missing. No signing key will be generated or replaced."
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/sowia-existing-upload-key"
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"; then
            echo "::error::The existing keystore secret could not be decoded. No signing key was generated or changed."
            exit 1
          fi
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::The decoded keystore is empty. No signing key was generated or changed."
            exit 1
          fi

          # The original Play upload certificate is a JKS and must remain unchanged.
          EXPECTED_CERT_SHA256="A967AA50C0257BFF7D7EFA0D102035A61AAE4A0A085717702152BECCADF304F4"
          ACTUAL_CERT_SHA256="$(keytool -list -v -keystore "$KEYSTORE_PATH" -storetype JKS -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" 2>/dev/null | awk -F": " '/SHA256:/{gsub(/:/,"",$2); print toupper($2); exit}')"
          if [ -z "$ACTUAL_CERT_SHA256" ]; then
            echo "::error::The existing JKS could not be opened with the configured store password and alias. No signing material was changed."
            exit 1
          fi
          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::The certificate fingerprint does not match the original Play upload certificate. Release signing is stopped to protect app updates."
            exit 1
          fi
          VALIDATED_TYPE="JKS"

          # Test the private-key password by signing a disposable empty JAR; never alter the keystore.
          python - <<'PY'
          from zipfile import ZipFile
          with ZipFile("signing-probe.jar", "w"):
              pass
          PY
          if ! jarsigner -keystore "$KEYSTORE_PATH" -storetype "$VALIDATED_TYPE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" signing-probe.jar "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::The keystore and alias are valid, but the private-key password does not unlock the existing key. No signing material was changed."
            exit 1
          fi
          rm -f signing-probe.jar

          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_TYPE=$VALIDATED_TYPE" >> "$GITHUB_ENV"
          echo "Existing keystore, alias, and private-key password validated (format: $VALIDATED_TYPE). No signing material was changed."

      - name: Validate Supabase configuration and build current release AAB
        env:
          SOWIA_SUPABASE_URL: ${{ secrets.SOWIA_SUPABASE_URL }}
          SOWIA_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SOWIA_SUPABASE_PUBLISHABLE_KEY }}
          SOWIA_SUPABASE_ANON_KEY: ${{ secrets.SOWIA_SUPABASE_ANON_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SOWIA_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.SOWIA_UPLOAD_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.SOWIA_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          value = os.environ.get("SOWIA_SUPABASE_URL", "").strip()
          key = (os.environ.get("SOWIA_SUPABASE_PUBLISHABLE_KEY", "").strip()
                 or os.environ.get("SOWIA_SUPABASE_ANON_KEY", "").strip())
          parsed = urlparse(value)
          if parsed.scheme != "https" or parsed.hostname != "qegcopordeqjiechmbhg.supabase.co" or parsed.path not in ("", "/") or parsed.query or parsed.fragment:
              raise SystemExit("SOWIA_SUPABASE_URL must be the HTTPS project root, without an API path.")
          if not key:
              raise SystemExit("SOWIA_SUPABASE_PUBLISHABLE_KEY or SOWIA_SUPABASE_ANON_KEY is missing.")
          for name in ("ANDROID_KEYSTORE_PASSWORD", "ANDROID_KEY_ALIAS", "ANDROID_KEY_PASSWORD"):
              if not os.environ.get(name, "").strip():
                  raise SystemExit(f"{name} is missing.")
          print("Supabase configuration and signing-secret presence validated.")
          PY
          gradle -p android :app:bundleCurrentRelease

      - name: Verify AAB exists and is signed
        run: |
          set -euo pipefail
          AAB="$(find android/app/build/outputs/bundle/currentRelease -maxdepth 1 -name '*.aab' -print -quit)"
          if [ -z "$AAB" ]; then
            echo "::error::The current-release AAB was not produced."
            exit 1
          fi
          jarsigner -verify "$AAB" > "$RUNNER_TEMP/aab-signature-check.txt" 2>&1
          if ! grep -qi "jar verified" "$RUNNER_TEMP/aab-signature-check.txt"; then
            cat "$RUNNER_TEMP/aab-signature-check.txt"
            echo "::error::The AAB signature could not be verified."
            exit 1
          fi
          mkdir -p release-output
          cp "$AAB" release-output/SOWIA-current-release.aab
          echo "Signed current-flavor AAB verified."

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: sowia-android-current-release-aab
          path: release-output/SOWIA-current-release.aab
          if-no-files-found: error
          retention-days: 14
