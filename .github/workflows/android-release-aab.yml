name: SOW IA Android release AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-release-aab.yml'

permissions:
  contents: read

jobs:
  bundle-current-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Validate and prepare the existing Android signing key
        env:
          SOWIA_UPLOAD_KEYSTORE_BASE64: ${{ secrets.SOWIA_UPLOAD_KEYSTORE_BASE64 }}
          SOWIA_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.SOWIA_UPLOAD_KEYSTORE_PASSWORD }}
          SOWIA_UPLOAD_KEY_ALIAS: ${{ secrets.SOWIA_UPLOAD_KEY_ALIAS }}
          SOWIA_UPLOAD_KEY_PASSWORD: ${{ secrets.SOWIA_UPLOAD_KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          # Prefer the complete legacy SOWIA_UPLOAD_* set when present.
          # Otherwise keep using the complete ANDROID_* set.
          if [[ -n "${SOWIA_UPLOAD_KEYSTORE_BASE64:-}" && -n "${SOWIA_UPLOAD_KEYSTORE_PASSWORD:-}" && -n "${SOWIA_UPLOAD_KEY_ALIAS:-}" && -n "${SOWIA_UPLOAD_KEY_PASSWORD:-}" ]]; then
            ANDROID_KEYSTORE_BASE64="$SOWIA_UPLOAD_KEYSTORE_BASE64"
            ANDROID_KEYSTORE_PASSWORD="$SOWIA_UPLOAD_KEYSTORE_PASSWORD"
            ANDROID_KEY_ALIAS="$SOWIA_UPLOAD_KEY_ALIAS"
            ANDROID_KEY_PASSWORD="$SOWIA_UPLOAD_KEY_PASSWORD"
          fi
          export ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required signing secret $name is missing. No signing key will be generated or replaced."
              exit 1
            fi
          done

          KEYSTORE_PATH="$RUNNER_TEMP/sowia-existing-upload-key"
          export ANDROID_KEYSTORE_BASE64
          python3 - <<'PY'
          import base64, os, re
          from pathlib import Path
          value = "".join(os.environ["ANDROID_KEYSTORE_BASE64"].strip().split())
          value = re.sub(r"[^A-Za-z0-9+/=_-]", "", value)
          value = value.replace("-", "+").replace("_", "/").rstrip("=")
          if not value:
              raise SystemExit("The existing keystore secret contains no Base64 data.")
          value += "=" * (-len(value) % 4)
          try:
              raw = base64.b64decode(value, validate=True)
          except Exception:
              raise SystemExit("The existing keystore secret is not valid Base64.")
          if not raw:
              raise SystemExit("The decoded existing keystore is empty.")
          Path(os.environ["RUNNER_TEMP"], "sowia-existing-upload-key").write_bytes(raw)
          print("Existing keystore decoded; no signing material was changed.")
          PY

          EXPECTED_CERT_SHA256="A967AA50C0257BFF7D7EFA0D102035A61AAE4A0A085717702152BECCADF304F4"
          STORE_TYPE=""
          STORE_PASSWORD=""
          for candidate_password in "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD"; do
            for candidate_type in JKS PKCS12; do
              if keytool -list -storetype "$candidate_type" -keystore "$KEYSTORE_PATH" -storepass "$candidate_password" >/dev/null 2>&1; then
                STORE_TYPE="$candidate_type"
                STORE_PASSWORD="$candidate_password"
                break 2
              fi
            done
          done
          if [ -z "$STORE_TYPE" ]; then
            echo "::error::The existing keystore file decoded correctly, but neither configured password opens it as JKS or PKCS12. No signing material was changed."
            exit 1
          fi
          echo "Existing keystore opened successfully (format: $STORE_TYPE)."

          KEY_ALIAS="$ANDROID_KEY_ALIAS"
          if ! keytool -list -storetype "$STORE_TYPE" -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            ALIASES="$(keytool -list -v -storetype "$STORE_TYPE" -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" 2>/dev/null | awk -F': ' '/^Alias name:/{print $2}')"
            ALIAS_COUNT="$(printf '%s\n' "$ALIASES" | sed '/^$/d' | wc -l | tr -d ' ')"
            if [ "$ALIAS_COUNT" != "1" ]; then
              echo "::error::The keystore opens, but the configured alias is absent and there is not exactly one alias to identify safely."
              exit 1
            fi
            KEY_ALIAS="$ALIASES"
          fi

          ACTUAL_CERT_SHA256="$(keytool -list -v -storetype "$STORE_TYPE" -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null | awk -F': ' '/SHA256:/{gsub(/:/,"",$2); print toupper($2); exit}')"
          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::The existing keystore certificate does not match the registered Play upload certificate. Release signing is stopped."
            exit 1
          fi
          echo "Registered Play upload certificate fingerprint verified."

          python3 - <<'PY'
          from zipfile import ZipFile
          with ZipFile("signing-probe.jar", "w"):
              pass
          PY
          KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
          if ! jarsigner -keystore "$KEYSTORE_PATH" -storetype "$STORE_TYPE" -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" signing-probe.jar "$KEY_ALIAS" >/dev/null 2>&1; then
            if ! jarsigner -keystore "$KEYSTORE_PATH" -storetype "$STORE_TYPE" -storepass "$STORE_PASSWORD" -keypass "$STORE_PASSWORD" signing-probe.jar "$KEY_ALIAS" >/dev/null 2>&1; then
              echo "::error::The original keystore and certificate are correct, but neither configured password unlocks the private key."
              exit 1
            fi
            KEY_PASSWORD="$STORE_PASSWORD"
          fi
          rm -f signing-probe.jar

          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "ANDROID_KEYSTORE_TYPE=$STORE_TYPE"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Original Play upload key, certificate, alias, and private-key access verified. No signing material was modified."

      - name: Validate Supabase configuration and build current release AAB
        env:
          SOWIA_SUPABASE_URL: ${{ secrets.SOWIA_SUPABASE_URL }}
          SOWIA_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SOWIA_SUPABASE_PUBLISHABLE_KEY }}
          SOWIA_SUPABASE_ANON_KEY: ${{ secrets.SOWIA_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          value = os.environ.get("SOWIA_SUPABASE_URL", "").strip()
          key = (os.environ.get("SOWIA_SUPABASE_PUBLISHABLE_KEY", "").strip()
                 or os.environ.get("SOWIA_SUPABASE_ANON_KEY", "").strip())
          parsed = urlparse(value)
          if parsed.scheme != "https" or parsed.hostname != "qegcopordeqjiechmbhg.supabase.co" or parsed.path not in ("", "/") or parsed.query or parsed.fragment:
              raise SystemExit("SOWIA_SUPABASE_URL must be the HTTPS project root, without an API path.")
          if not key:
              raise SystemExit("SOWIA_SUPABASE_PUBLISHABLE_KEY or SOWIA_SUPABASE_ANON_KEY is missing.")
          for name in ("ANDROID_KEYSTORE_PASSWORD", "ANDROID_KEY_ALIAS", "ANDROID_KEY_PASSWORD"):
              if not os.environ.get(name, "").strip():
                  raise SystemExit(f"{name} is missing.")
          print("Supabase configuration and signing-secret presence validated.")
          PY
          gradle -p android :app:bundleCurrentRelease

      - name: Verify AAB exists and is signed
        run: |
          set -euo pipefail
          AAB="$(find android/app/build/outputs/bundle/currentRelease -maxdepth 1 -name '*.aab' -print -quit)"
          if [ -z "$AAB" ]; then
            echo "::error::The current-release AAB was not produced."
            exit 1
          fi
          jarsigner -verify "$AAB" > "$RUNNER_TEMP/aab-signature-check.txt" 2>&1
          if ! grep -qi "jar verified" "$RUNNER_TEMP/aab-signature-check.txt"; then
            cat "$RUNNER_TEMP/aab-signature-check.txt"
            echo "::error::The AAB signature could not be verified."
            exit 1
          fi
          mkdir -p release-output
          cp "$AAB" release-output/SOWIA-current-release.aab
          echo "Signed current-flavor AAB verified."

      - name: Upload signed AAB
        uses: actions/upload-artifact@v7
        with:
          name: sowia-android-current-release-aab
          path: release-output/SOWIA-current-release.aab
          if-no-files-found: error
          retention-days: 14
