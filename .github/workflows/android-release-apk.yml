name: SOW IA Android direct-install APK
# Fresh run requested for free public APK distribution; application source and secrets remain untouched.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-release-apk.yml'
      - 'android/**'

permissions:
  contents: read

jobs:
  build-signed-current-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Validate and prepare the existing registered signing key
        env:
          SOWIA_UPLOAD_KEYSTORE_BASE64: ${{ secrets.SOWIA_UPLOAD_KEYSTORE_BASE64 }}
          SOWIA_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.SOWIA_UPLOAD_KEYSTORE_PASSWORD }}
          SOWIA_UPLOAD_KEY_ALIAS: ${{ secrets.SOWIA_UPLOAD_KEY_ALIAS }}
          SOWIA_UPLOAD_KEY_PASSWORD: ${{ secrets.SOWIA_UPLOAD_KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          import re
          import subprocess
          import zipfile
          from pathlib import Path

          expected = "A967AA50C0257BFF7D7EFA0D102035A61AAE4A0A085717702152BECCADF304F4"
          root = Path(os.environ["RUNNER_TEMP"])
          key_candidates = [
              ("SOWIA_UPLOAD_KEYSTORE_BASE64", os.environ.get("SOWIA_UPLOAD_KEYSTORE_BASE64", "")),
              ("ANDROID_KEYSTORE_BASE64", os.environ.get("ANDROID_KEYSTORE_BASE64", "")),
          ]
          store_passwords = list(dict.fromkeys(
              x for x in (
                  os.environ.get("SOWIA_UPLOAD_KEYSTORE_PASSWORD", ""),
                  os.environ.get("ANDROID_KEYSTORE_PASSWORD", ""),
                  os.environ.get("SOWIA_UPLOAD_KEY_PASSWORD", ""),
                  os.environ.get("ANDROID_KEY_PASSWORD", ""),
              ) if x
          ))
          key_passwords = list(dict.fromkeys(
              x for x in (
                  os.environ.get("SOWIA_UPLOAD_KEY_PASSWORD", ""),
                  os.environ.get("ANDROID_KEY_PASSWORD", ""),
                  os.environ.get("SOWIA_UPLOAD_KEYSTORE_PASSWORD", ""),
                  os.environ.get("ANDROID_KEYSTORE_PASSWORD", ""),
              ) if x
          ))
          aliases = list(dict.fromkeys(
              x for x in (
                  os.environ.get("SOWIA_UPLOAD_KEY_ALIAS", ""),
                  os.environ.get("ANDROID_KEY_ALIAS", ""),
              ) if x
          ))
          if not any(value.strip() for _, value in key_candidates):
              raise SystemExit("No existing upload-keystore data is configured. No key was generated.")
          if not store_passwords or not key_passwords:
              raise SystemExit("Existing signing password fields are incomplete. No key was generated.")

          def run(args):
              return subprocess.run(args, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)

          selected = None
          decoded_count = 0
          for label, encoded in key_candidates:
              if not encoded.strip():
                  continue
              value = "".join(encoded.strip().split())
              if value.startswith("data:") and "," in value:
                  value = value.split(",", 1)[1]
              value = re.sub(r"[^A-Za-z0-9+/=_-]", "", value)
              value = value.replace("-", "+").replace("_", "/").rstrip("=")
              if not value:
                  continue
              value += "=" * (-len(value) % 4)
              try:
                  raw = base64.b64decode(value, validate=True)
              except Exception:
                  continue
              if not raw:
                  continue
              decoded_count += 1
              keystore = root / ("sowia-existing-upload-" + str(decoded_count))
              keystore.write_bytes(raw)

              for store_type in ("JKS", "PKCS12"):
                  for store_password in store_passwords:
                      listing = run([
                          "keytool", "-list", "-v", "-storetype", store_type,
                          "-keystore", str(keystore), "-storepass", store_password
                      ])
                      if listing.returncode != 0:
                          continue
                      found_aliases = re.findall(r"^Alias name: (.+)$", listing.stdout, re.M)
                      candidates = list(dict.fromkeys(aliases + found_aliases))
                      for alias in candidates:
                          cert = run([
                              "keytool", "-list", "-v", "-storetype", store_type,
                              "-keystore", str(keystore), "-storepass", store_password,
                              "-alias", alias
                          ])
                          if cert.returncode != 0:
                              continue
                          match = re.search(r"SHA256:\s*([0-9A-Fa-f:]+)", cert.stdout)
                          actual = re.sub(r":", "", match.group(1)).upper() if match else ""
                          if actual != expected:
                              continue

                          probe = root / "sowia-signing-probe.jar"
                          with zipfile.ZipFile(probe, "w"):
                              pass
                          for key_password in key_passwords:
                              signed = run([
                                  "jarsigner", "-keystore", str(keystore),
                                  "-storetype", store_type, "-storepass", store_password,
                                  "-keypass", key_password, str(probe), alias
                              ])
                              if signed.returncode == 0:
                                  selected = (keystore, store_type, store_password, alias, key_password, label)
                                  break
                          probe.unlink(missing_ok=True)
                          if selected:
                              break
                      if selected:
                          break
                  if selected:
                      break
              if selected:
                  break

          if not selected:
              raise SystemExit(
                  "No configured keystore/password/alias combination both unlocks the private key "
                  "and matches the registered SOW IA upload certificate. No signing material was changed."
              )

          keystore, store_type, store_password, alias, key_password, source = selected
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"ANDROID_KEYSTORE_PATH={keystore}\\n")
              env.write(f"ANDROID_KEYSTORE_TYPE={store_type}\\n")
              env.write(f"ANDROID_KEYSTORE_PASSWORD={store_password}\\n")
              env.write(f"ANDROID_KEY_ALIAS={alias}\\n")
              env.write(f"ANDROID_KEY_PASSWORD={key_password}\\n")
          print(
              "Original registered SOW IA upload certificate and private-key access verified. "
              f"Existing credential set selected: {source}. No secret or signing key was modified."
          )
          PY

      - name: Validate Supabase configuration and build installable APK
        env:
          SOWIA_SUPABASE_URL: ${{ secrets.SOWIA_SUPABASE_URL }}
          SOWIA_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SOWIA_SUPABASE_PUBLISHABLE_KEY }}
          SOWIA_SUPABASE_ANON_KEY: ${{ secrets.SOWIA_SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          url = urlparse(os.environ.get("SOWIA_SUPABASE_URL", "").strip())
          key = (os.environ.get("SOWIA_SUPABASE_PUBLISHABLE_KEY", "").strip()
                 or os.environ.get("SOWIA_SUPABASE_ANON_KEY", "").strip())
          if url.scheme != "https" or url.hostname != "qegcopordeqjiechmbhg.supabase.co" or url.path not in ("", "/") or url.query or url.fragment:
              raise SystemExit("SOWIA_SUPABASE_URL must be the HTTPS project root.")
          if not key:
              raise SystemExit("SOWIA_SUPABASE_PUBLISHABLE_KEY or SOWIA_SUPABASE_ANON_KEY is missing.")
          print("Supabase project URL and public-key configuration are present.")
          PY
          gradle -p android :app:assembleCurrentRelease

      - name: Verify package ID and original signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk -type f -path '*/current/release/*.apk' -print -quit)"
          if [[ -z "$APK" ]]; then
            echo "::error::No current-flavor release APK was produced."
            exit 1
          fi
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" "$ANDROID_HOME/tools" -type f -name apkanalyzer 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$APKSIGNER" || -z "$APKANALYZER" ]]; then
            echo "::error::Android SDK verification tools are unavailable on this runner."
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/apk-signature.txt"
          ACTUAL_CERT_SHA256="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print toupper($2); exit}' "$RUNNER_TEMP/apk-signature.txt" | tr -d ':')"
          EXPECTED_CERT_SHA256="A967AA50C0257BFF7D7EFA0D102035A61AAE4A0A085717702152BECCADF304F4"
          if [[ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]]; then
            cat "$RUNNER_TEMP/apk-signature.txt"
            echo "::error::APK signature does not match the original registered SOW IA certificate."
            exit 1
          fi
          PACKAGE_ID="$("$APKANALYZER" manifest application-id "$APK")"
          if [[ "$PACKAGE_ID" != "com.sowkeys.sowia" ]]; then
            echo "::error::Unexpected Android application ID: $PACKAGE_ID"
            exit 1
          fi
          mkdir -p release-output
          cp "$APK" release-output/SOW-IA-Android-release.apk
          sha256sum release-output/SOW-IA-Android-release.apk | tee release-output/SHA256SUMS.txt
          echo "APK verified: application ID and original registered signing certificate both match."

      - name: Upload production-signed APK
        uses: actions/upload-artifact@v7
        with:
          name: sowia-android-current-release-apk
          path: release-output/*
          if-no-files-found: error
          retention-days: 14
