name: Android release bundle

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-release-bundle.yml"
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-release-bundle.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SOWIA_SUPABASE_URL: ${{ secrets.SOWIA_SUPABASE_URL }}
  SOWIA_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SOWIA_SUPABASE_PUBLISHABLE_KEY }}

jobs:
  bundle-release:
    name: Build Android release APKs with the registered upload key
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore and verify the original Android upload key
        shell: bash
        env:
          SOWIA_UPLOAD_KEYSTORE_BASE64: ${{ secrets.SOWIA_UPLOAD_KEYSTORE_BASE64 }}
          SOWIA_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.SOWIA_UPLOAD_KEYSTORE_PASSWORD }}
          SOWIA_UPLOAD_KEY_ALIAS: ${{ secrets.SOWIA_UPLOAD_KEY_ALIAS }}
          SOWIA_UPLOAD_KEY_PASSWORD: ${{ secrets.SOWIA_UPLOAD_KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          EXPECTED_FINGERPRINT="A967AA50C0257BFF7D7EFA0D102035A61AAE4A0A085717702152BECCADF304F4"

          if [[ -n "$SOWIA_UPLOAD_KEYSTORE_BASE64" && -n "$SOWIA_UPLOAD_KEYSTORE_PASSWORD" && -n "$SOWIA_UPLOAD_KEY_ALIAS" && -n "$SOWIA_UPLOAD_KEY_PASSWORD" ]]; then
            ENCODED_KEY="$SOWIA_UPLOAD_KEYSTORE_BASE64"
            STORE_PASSWORD="$SOWIA_UPLOAD_KEYSTORE_PASSWORD"
            KEY_ALIAS="$SOWIA_UPLOAD_KEY_ALIAS"
            KEY_PASSWORD="$SOWIA_UPLOAD_KEY_PASSWORD"
          elif [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            ENCODED_KEY="$ANDROID_KEYSTORE_BASE64"
            STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
            KEY_ALIAS="$ANDROID_KEY_ALIAS"
            KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
          else
            echo "::error::The original Android upload-key secrets are not all configured. No replacement key will be generated."
            exit 1
          fi

          for value in "$ENCODED_KEY" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            echo "::add-mask::$value"
          done

          export ENCODED_KEY
          python3 - <<'PY'
          import base64, os, re
          from pathlib import Path
          value = os.environ["ENCODED_KEY"].strip()
          if value.startswith("data:") and "," in value:
              value = value.split(",", 1)[1]
          value = "".join(value.split()).replace("-", "+").replace("_", "/")
          value = re.sub(r"[^A-Za-z0-9+/=]", "", value).rstrip("=")
          if not value or not re.fullmatch(r"[A-Za-z0-9+/]+", value):
              raise SystemExit("The configured upload keystore is not valid Base64.")
          value += "=" * (-len(value) % 4)
          try:
              raw = base64.b64decode(value, validate=True)
          except Exception:
              raise SystemExit("The configured upload keystore could not be decoded.")
          if not raw:
              raise SystemExit("The decoded upload keystore is empty.")
          print("Decoded the configured upload keystore; certificate identity and private-key access will be verified with keytool below.")
          Path(os.environ["RUNNER_TEMP"], "sowia-original-upload.keystore").write_bytes(raw)
          PY
          KEYSTORE="$RUNNER_TEMP/sowia-original-upload.keystore"
          STORE_TYPE=""
          PASSWORD_CANDIDATES=("$STORE_PASSWORD" "$KEY_PASSWORD")
          for candidate_password in "${PASSWORD_CANDIDATES[@]}"; do
            for candidate_type in JKS PKCS12; do
              if keytool -list -storetype "$candidate_type" -keystore "$KEYSTORE" -storepass "$candidate_password" >/dev/null 2>&1; then
                STORE_TYPE="$candidate_type"
                STORE_PASSWORD="$candidate_password"
                break 2
              fi
            done
          done
          if [[ -z "$STORE_TYPE" ]]; then
            echo "::error::The verified A967 keystore file is present, but neither configured password opens it. No release APK was produced."
            exit 1
          fi
          echo "Keystore opened successfully using one of the two configured password fields."

          # Older SOW IA uploads used a different alias. If the configured alias
          # is absent, safely detect the sole private-key alias in this keystore.
          if ! keytool -list -storetype "$STORE_TYPE" -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            DETECTED_ALIASES="$(keytool -list -v -storetype "$STORE_TYPE" -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" | awk -F': ' '/^Alias name:/{print $2}')"
            ALIAS_COUNT="$(printf '%s\\n' "$DETECTED_ALIASES" | sed '/^$/d' | wc -l | tr -d ' ')"
            if [[ "$ALIAS_COUNT" != "1" ]]; then
              echo "::error::The configured alias is absent and the keystore does not contain exactly one alias."
              exit 1
            fi
            KEY_ALIAS="$DETECTED_ALIASES"
          fi

          ACTUAL_FINGERPRINT="$(keytool -list -v -storetype "$STORE_TYPE" -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ': ' | tr '[:lower:]' '[:upper:]')"
          if [[ "$ACTUAL_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]]; then
            echo "::error::The configured upload key does not match the registered SOW IA certificate. No release APK will be produced."
            exit 1
          fi
          if ! keytool -certreq -storetype "$STORE_TYPE" -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" -alias "$KEY_ALIAS" -dname "CN=SOWIA Android Upload" -file "$RUNNER_TEMP/sowia-signing-check.csr" >/dev/null 2>&1; then
            rm -f "$RUNNER_TEMP/sowia-signing-check.csr"
            if [[ "$KEY_PASSWORD" == "$STORE_PASSWORD" ]]; then
              echo "::error::The keystore opens, but the private-key password is invalid."
              exit 1
            fi
            if ! keytool -certreq -storetype "$STORE_TYPE" -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -keypass "$STORE_PASSWORD" -alias "$KEY_ALIAS" -dname "CN=SOWIA Android Upload" -file "$RUNNER_TEMP/sowia-signing-check.csr" >/dev/null 2>&1; then
              echo "::error::The keystore opens, but neither configured password unlocks its private key."
              exit 1
            fi
            KEY_PASSWORD="$STORE_PASSWORD"
          fi

          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE"
            echo "ANDROID_KEYSTORE_TYPE=$STORE_TYPE"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Original registered Android upload certificate verified."

      - name: Validate public Supabase configuration
        run: |
          set -euo pipefail
          [[ "$SOWIA_SUPABASE_URL" == https://*.supabase.co ]]
          [[ "$SOWIA_SUPABASE_PUBLISHABLE_KEY" == sb_publishable_* ]]

      - name: Build signed release bundles and APKs
        run: gradle -p android :app:bundleCurrentRelease :app:assembleCurrentRelease :app:assembleLegacyRelease

      - name: Verify current APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/current/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)/apksigner"
          CERT_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1)"
          ACTUAL_FINGERPRINT="$(printf '%s\\n' "$CERT_OUTPUT" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $NF; exit}' | tr -d ': ' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_FINGERPRINT="A967AA50C0257BFF7D7EFA0D102035A61AAE4A0A085717702152BECCADF304F4"
          [[ "$ACTUAL_FINGERPRINT" == "$EXPECTED_FINGERPRINT" ]]

      - name: Upload signed current APK
        uses: actions/upload-artifact@v4
        with:
          name: sowia-android-current-compatible-apk
          path: android/app/build/outputs/apk/current/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload signed legacy APK
        uses: actions/upload-artifact@v4
        with:
          name: sowia-android-legacy-compatible-apk
          path: android/app/build/outputs/apk/legacy/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload signed Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: sowia-android-release-signed
          path: android/app/build/outputs/bundle/currentRelease/*.aab
          if-no-files-found: error
          retention-days: 7

  build-debug-apk:
    name: Build Android debug APK (independent of release signing)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build installable debug APK
        run: gradle -p android :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sowia-android-debug-apk
          path: android/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 3
