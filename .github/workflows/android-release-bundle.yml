name: Android release bundle

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-release-bundle.yml"
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-release-bundle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle-release:
    name: Build Android release AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Pull-request builds stay unsigned. Signing secrets are only read
      # for pushes to main and manually dispatched release builds.
      - name: Decode and validate Android upload keystore
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Android signing secrets are missing. Add all four repository secrets before running a signed build."
            exit 1
          fi

          # Accept plain Base64, wrapped Base64, URL-safe Base64, and data-URI input.
          python3 - <<'PY'
          import base64
          import os
          import re
          from pathlib import Path

          value = os.environ["ANDROID_KEYSTORE_BASE64"].strip()
          if value.startswith("data:") and "," in value:
              value = value.split(",", 1)[1]
          # Remove separators/quotes accidentally included when copying the value.
          # Keep the Base64 alphabet and padding; keytool below rejects corrupted data.
          value = "".join(value.split())
          if value.lower().startswith("base64:"):
              value = value.split(":", 1)[1]
          value = value.replace("-", "+").replace("_", "/")
          value = re.sub(r"[^A-Za-z0-9+/=]", "", value)
          # Rebuild padding from the payload itself. This also repairs padding copied
          # into the middle of wrapped output by some Android Base64 converter apps.
          value = value.replace("=", "")

          if not value or not re.fullmatch(r"[A-Za-z0-9+/]+", value):
              raise SystemExit("ANDROID_KEYSTORE_BASE64 is empty after removing copy/paste separators.")
          value += "=" * (-len(value) % 4)
          try:
              decoded = base64.b64decode(value, validate=True)
          except Exception:
              raise SystemExit("ANDROID_KEYSTORE_BASE64 could not be decoded. Re-encode the original .jks file as Base64.")

          if not decoded:
              raise SystemExit("Decoded Android keystore is empty.")
          Path(os.environ["RUNNER_TEMP"], "sowia-upload.jks").write_bytes(decoded)
          PY

          # Verify the file, store password, and alias before Gradle starts.
          keytool -list -keystore "$RUNNER_TEMP/sowia-upload.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/sowia-upload.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "Android keystore decoded and validated successfully."

      - name: Build release bundle
        run: gradle -p android :app:bundleRelease

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: sowia-android-release-${{ github.event_name == 'pull_request' && 'unsigned' || 'signed' }}
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
