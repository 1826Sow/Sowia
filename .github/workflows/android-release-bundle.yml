name: Android release bundle

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-release-bundle.yml"
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-release-bundle.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SOWIA_SUPABASE_URL: https://qegcopordeqjiechmbhg.supabase.co
  SOWIA_SUPABASE_PUBLISHABLE_KEY: sb_publishable_a15NAIP7-ofyV5krT2a07A_M40bthGp

jobs:
  bundle-release:
    name: Build Android release AAB
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # The release build accepts ONLY the upload key already registered with Google Play.
      # Configure these four GitHub Actions secrets from the original keystore.
      - name: Validate and install original Google Play upload key
        env:
          SOWIA_UPLOAD_KEYSTORE_BASE64: ${{ secrets.SOWIA_UPLOAD_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
          SOWIA_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.SOWIA_UPLOAD_KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          SOWIA_UPLOAD_KEY_ALIAS: ${{ secrets.SOWIA_UPLOAD_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
          SOWIA_UPLOAD_KEY_PASSWORD: ${{ secrets.SOWIA_UPLOAD_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in SOWIA_UPLOAD_KEYSTORE_BASE64 SOWIA_UPLOAD_KEYSTORE_PASSWORD SOWIA_UPLOAD_KEY_ALIAS SOWIA_UPLOAD_KEY_PASSWORD; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "::error::Secret presence check: $name=missing"
              missing+=("$name")
            else
              echo "::notice::Secret presence check: $name=present"
              echo "::add-mask::$value"
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Release signing stopped. One or more original upload-key secrets were not passed to this job. No secret values were displayed."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/sowia-original-upload.keystore"
          printf '%s' "$SOWIA_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          STORE_TYPE=""
          for candidate in JKS PKCS12; do
            if keytool -list -v -storetype "$candidate" -keystore "$KEYSTORE" -storepass "$SOWIA_UPLOAD_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/sowia-keystore-list.txt" 2> "$RUNNER_TEMP/sowia-keytool-error.txt"; then
              STORE_TYPE="$candidate"
              break
            fi
          done
          if [ -z "$STORE_TYPE" ]; then
            echo "::error::The uploaded keystore cannot be opened as JKS or PKCS12. No release bundle was signed."
            cat "$RUNNER_TEMP/sowia-keytool-error.txt"
            exit 1
          fi
          if ! keytool -list -v -storetype "$STORE_TYPE" -keystore "$KEYSTORE" -storepass "$SOWIA_UPLOAD_KEYSTORE_PASSWORD" -alias "$SOWIA_UPLOAD_KEY_ALIAS" > "$RUNNER_TEMP/sowia-keystore-inspection.txt" 2> "$RUNNER_TEMP/sowia-keytool-error.txt"; then
            echo "::error::The keystore opens, but the configured key alias is not available. No release bundle was signed."
            cat "$RUNNER_TEMP/sowia-keytool-error.txt"
            exit 1
          fi
          echo "Detected original upload keystore format: $STORE_TYPE"
          ACTUAL_FINGERPRINT="$(awk -F 'SHA256: ' '/SHA256:/{gsub(/:/,"",$2); print toupper($2); exit}' "$RUNNER_TEMP/sowia-keystore-inspection.txt")"
          EXPECTED_FINGERPRINT="A967AA50C0257BFF7D7EFA0D102035A61AAE4A0A085717702152BECCADF304F4"
          if [ "$ACTUAL_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]; then
            echo "::error::The configured keystore does not match the Google-validated upload certificate. No release bundle will be signed."
            exit 1
          fi
          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE"
            echo "ANDROID_KEYSTORE_TYPE=$STORE_TYPE"
            echo "ANDROID_KEYSTORE_PASSWORD=$SOWIA_UPLOAD_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$SOWIA_UPLOAD_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$SOWIA_UPLOAD_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Original Google-validated upload certificate verified."

      - name: Validate Android public Supabase configuration
        run: |
          set -euo pipefail
          [[ "$SOWIA_SUPABASE_URL" == https://*.supabase.co ]]
          [[ "$SOWIA_SUPABASE_PUBLISHABLE_KEY" == sb_publishable_* ]]

      - name: Build release bundle
        run: gradle -p android :app:bundleRelease

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: sowia-android-release-signed
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 3

  build-debug-apk:
    name: Build Android debug APK (independent of release signing)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate Android public Supabase configuration
        run: |
          set -euo pipefail
          [[ "$SOWIA_SUPABASE_URL" == https://*.supabase.co ]]
          [[ "$SOWIA_SUPABASE_PUBLISHABLE_KEY" == sb_publishable_* ]]

      - name: Build installable debug APK
        run: gradle -p android :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sowia-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 3
