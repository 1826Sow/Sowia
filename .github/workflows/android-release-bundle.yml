name: Android release bundle

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-release-bundle.yml"
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-release-bundle.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SOWIA_SUPABASE_URL: ${{ secrets.SOWIA_SUPABASE_URL }}
  SOWIA_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SOWIA_SUPABASE_PUBLISHABLE_KEY }}

jobs:
  bundle-release:
    name: Build Android release AAB
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore and validate the original SOW IA upload keystore
        env:
          SOWIA_UPLOAD_KEYSTORE_BASE64: ${{ secrets.SOWIA_UPLOAD_KEYSTORE_BASE64 }}
          SOWIA_KEYSTORE_PASSWORD: ${{ secrets.SOWIA_KEYSTORE_PASSWORD }}
          SOWIA_KEY_PASSWORD: ${{ secrets.SOWIA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SOWIA_UPLOAD_KEYSTORE_BASE64 SOWIA_KEYSTORE_PASSWORD SOWIA_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::GitHub Actions secret $name is missing."
              exit 1
            fi
          done
          KEYSTORE="$GITHUB_WORKSPACE/sowia-original-upload.jks"
          printf '%s' "$SOWIA_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          keytool -list -storetype JKS -keystore "$KEYSTORE" -storepass "$SOWIA_KEYSTORE_PASSWORD" -alias uploadsowia-upload >/dev/null
          ACTUAL_FINGERPRINT="$(keytool -list -v -storetype JKS -keystore "$KEYSTORE" -storepass "$SOWIA_KEYSTORE_PASSWORD" -alias uploadsowia-upload | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ': ' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_FINGERPRINT="A967AA50C0257BFF7D7EFA0D102035A61AAE4A0A085717702152BECCADF304F4"
          if [[ "$ACTUAL_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]]; then
            echo "::error::The keystore certificate does not match the registered SOW IA upload certificate. Build stopped."
            exit 1
          fi
          keytool -certreq -storetype JKS -keystore "$KEYSTORE" -storepass "$SOWIA_KEYSTORE_PASSWORD" -keypass "$SOWIA_KEY_PASSWORD" -alias uploadsowia-upload -dname "CN=SOWIA Android Upload" -file "$RUNNER_TEMP/sowia-signing-check.csr" >/dev/null
          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE"
            echo "ANDROID_KEYSTORE_TYPE=JKS"
            echo "ANDROID_KEYSTORE_PASSWORD=$SOWIA_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=uploadsowia-upload"
            echo "ANDROID_KEY_PASSWORD=$SOWIA_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Original SOW IA upload certificate and signing credentials validated."
          
      - name: Validate Android public Supabase configuration
        run: |
          set -euo pipefail
          if [[ -z "$SOWIA_SUPABASE_URL" ]]; then
            echo "::error::GitHub Actions secret SOWIA_SUPABASE_URL is missing."
            exit 1
          fi
          if [[ "$SOWIA_SUPABASE_URL" != https://*.supabase.co ]]; then
            echo "::error::SOWIA_SUPABASE_URL must be the project URL ending in .supabase.co."
            exit 1
          fi
          if [[ -z "$SOWIA_SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "::error::GitHub Actions secret SOWIA_SUPABASE_PUBLISHABLE_KEY is missing."
            exit 1
          fi
          if [[ "$SOWIA_SUPABASE_PUBLISHABLE_KEY" != sb_publishable_* ]]; then
            echo "::error::SOWIA_SUPABASE_PUBLISHABLE_KEY must be the public sb_publishable_ key, not a secret/service-role key."
            exit 1
          fi
          echo "Both public Supabase settings are present and have the expected format."

      - name: Build release bundles
        run: gradle -p android :app:bundleRelease

      - name: Upload release AABs
        uses: actions/upload-artifact@v4
        with:
          name: sowia-android-release-signed
          path: android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 3

      - name: Build APK for the primary application identity
        run: gradle -p android :app:assembleCurrentRelease

      - name: Verify primary APK signature matches the registered upload certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/current/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -z "$APK" ]]; then
            echo "::error::Primary release APK was not produced."
            exit 1
          fi
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)/apksigner"
          test -x "$APKSIGNER"
          CERT_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1)"
          printf '%s\n' "$CERT_OUTPUT"
          ACTUAL_FINGERPRINT="$(printf '%s\n' "$CERT_OUTPUT" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $NF; exit}' | tr -d ': ' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_FINGERPRINT="A967AA50C0257BFF7D7EFA0D102035A61AAE4A0A085717702152BECCADF304F4"
          if [[ "$ACTUAL_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]]; then
            echo "::error::APK signature does not match the registered SOW IA certificate. Artifact will not be uploaded."
            exit 1
          fi
          echo "Primary SOW IA APK signature verified."

      - name: Upload primary SOW IA APK
        uses: actions/upload-artifact@v4
        with:
          name: sowia-android-current-compatible-apk
          path: android/app/build/outputs/apk/current/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build APK for the existing parallel installation
        run: gradle -p android :app:assembleLegacyRelease

      - name: Upload compatible legacy APK
        uses: actions/upload-artifact@v4
        with:
          name: sowia-android-legacy-compatible-apk
          path: android/app/build/outputs/apk/legacy/release/*.apk
          if-no-files-found: error
          retention-days: 3

  build-debug-apk:
    name: Build Android debug APK (independent of release signing)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          gradle-version: "8.9"
          distribution: temurin
          java-version: "17"

      - name: Build installable debug APK
        run: gradle -p android :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sowia-android-debug-apk
          path: android/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 3
