name: Android release bundle

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-release-bundle.yml"
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-release-bundle.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SOWIA_SUPABASE_URL: ${{ secrets.SOWIA_SUPABASE_URL }}
  SOWIA_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SOWIA_SUPABASE_PUBLISHABLE_KEY }}

jobs:
  bundle-release:
    name: Build Android release AAB
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Find latest successful keystore generation
        id: keystore_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/generate-android-keystore.yml/runs?status=completed&per_page=20" --jq '.workflow_runs | map(select(.conclusion == "success")) | .[0].id')"
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::No successful Android keystore generation run was found."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Found a successful Android keystore generation run."

      - name: Download Android signing artifact
        uses: actions/download-artifact@v4
        with:
          name: sowia-android-signing-material
          run-id: ${{ steps.keystore_run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: signing-output

      - name: Validate Android upload keystore
        run: |
          set -euo pipefail
          test -s signing-output/sowia-upload.jks
          test -s signing-output/KEYSTORE_CREDENTIALS.txt
          set -a
          source signing-output/KEYSTORE_CREDENTIALS.txt
          set +a
          KEYSTORE="$GITHUB_WORKSPACE/signing-output/sowia-upload.jks"
          keytool -list -storetype JKS -keystore "$KEYSTORE" -storepass "$KEYSTORE_PASSWORD" >/dev/null
          keytool -list -storetype JKS -keystore "$KEYSTORE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          keytool -certreq -storetype JKS -keystore "$KEYSTORE" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -alias "$KEY_ALIAS" -dname "CN=SOWIA Android Upload" -file "$RUNNER_TEMP/sowia-signing-check.csr" >/dev/null
          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE"
            echo "ANDROID_KEYSTORE_TYPE=JKS"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Android keystore, alias, and both passwords validated successfully."

      - name: Validate Android public Supabase configuration
        run: |
          set -euo pipefail
          if [[ -z "$SOWIA_SUPABASE_URL" ]]; then
            echo "::error::GitHub Actions secret SOWIA_SUPABASE_URL is missing."
            exit 1
          fi
          if [[ "$SOWIA_SUPABASE_URL" != https://*.supabase.co ]]; then
            echo "::error::SOWIA_SUPABASE_URL must be the project URL ending in .supabase.co."
            exit 1
          fi
          if [[ -z "$SOWIA_SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "::error::GitHub Actions secret SOWIA_SUPABASE_PUBLISHABLE_KEY is missing."
            exit 1
          fi
          if [[ "$SOWIA_SUPABASE_PUBLISHABLE_KEY" != sb_publishable_* ]]; then
            echo "::error::SOWIA_SUPABASE_PUBLISHABLE_KEY must be the public sb_publishable_ key, not a secret/service-role key."
            exit 1
          fi
          echo "Both public Supabase settings are present and have the expected format."

      - name: Build release bundles
        run: gradle -p android :app:bundleRelease

      - name: Upload release AABs
        uses: actions/upload-artifact@v4
        with:
          name: sowia-android-release-signed
          path: android/app/build/outputs/bundle/*/release/*.aab
          if-no-files-found: error
          retention-days: 3

      - name: Build installable signed release APKs
        run: gradle -p android :app:assembleRelease

      - name: Upload all signed release APKs
        uses: actions/upload-artifact@v4
        with:
          name: sowia-android-release-signed-apk
          path: android/app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error
          retention-days: 3

      - name: Build APK for the existing parallel installation
        run: gradle -p android :app:assembleLegacyRelease

      - name: Upload compatible legacy APK
        uses: actions/upload-artifact@v4
        with:
          name: sowia-android-legacy-compatible-apk
          path: android/app/build/outputs/apk/legacy/release/*.apk
          if-no-files-found: error
          retention-days: 3

  build-debug-apk:
    name: Build Android debug APK (independent of release signing)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build installable debug APK
        run: gradle -p android :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sowia-android-debug-apk
          path: android/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 3
