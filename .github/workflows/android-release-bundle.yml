name: Android release bundle (unsigned)

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-release-bundle.yml"
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-release-bundle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle-release:
    name: Build Android release AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release bundle (unsigned)
        run: gradle -p android :app:bundleRelease

      - name: Upload unsigned AAB for internal build verification
        uses: actions/upload-artifact@v4
        with:
          name: sowia-android-release-unsigned
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
