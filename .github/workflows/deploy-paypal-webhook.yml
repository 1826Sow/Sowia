name: Deploy PayPal webhook

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Type DEPLOY to deploy the PayPal webhook to Supabase"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sowia-paypal-webhook-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm_deploy == 'DEPLOY' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy PayPal webhook Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::GitHub repository secret SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          fi
          supabase functions deploy paypal-webhook \
            --project-ref qegcopordeqjiechmbhg \
            --use-api
