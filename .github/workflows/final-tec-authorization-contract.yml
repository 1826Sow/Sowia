name: FINAL TEC authorization contract checks

on:
  pull_request:
    branches:
      - docs/final-tec-g0-g2b-authorization-contract
    paths:
      - "final_tec_authorization_contract.py"
      - "tests/test_final_tec_authorization_contract.py"
      - ".github/workflows/final-tec-authorization-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorization-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run isolated contract tests
        run: python -m pytest -q tests/test_final_tec_authorization_contract.py
