name: FINAL TEC investor dashboard checks

on:
  pull_request:
    paths:
      - "app.py"
      - "final_tec_access.py"
      - "final_tec_evidence_intake.py"
      - "final_tec_benchmark.py"
      - "final_tec_edge_engine.py"
      - "final_tec_edge_control_center.py"
      - "final_tec_evidence_monitor.py"
      - "final_tec_evidence_monitor_ui.py"
      - "final_tec_investor_dashboard.py"
      - "final_tec_evidence.py"
      - "final_tec_evidence_review.py"
      - "final_tec_audit_trail.py"
      - "tests/test_final_tec_access.py"
      - "tests/test_final_tec_published_metrics.py"
      - "tests/test_final_tec_evidence_intake.py"
      - "tests/test_final_tec_benchmark.py"
      - "tests/test_final_tec_edge_engine.py"
      - "tests/test_final_tec_edge_control_center.py"
      - "tests/test_final_tec_evidence_monitor.py"
      - "tests/test_final_tec_investor_dashboard.py"
      - "tests/test_final_tec_evidence.py"
      - "tests/test_final_tec_evidence_review.py"
      - "tests/test_final_tec_audit_trail.py"
      - ".github/workflows/final-tec-dashboard-checks.yml"
  push:
    branches:
      - "feature/final-tec-investor-live-dashboard"
      - "security/final-tec-server-side-access-guard"
      - "feature/final-tec-published-metrics-dashboard"
      - "feature/final-tec-evidence-intake"
      - "feature/final-tec-benchmark-registry"
      - "feature/final-tec-edge-engine"
      - "feature/final-tec-evidence-monitoring"
      - "feature/final-tec-evidence-review-engine"
      - "security/final-tec-audit-trail"
    paths:
      - "app.py"
      - "final_tec_access.py"
      - "final_tec_evidence_intake.py"
      - "final_tec_benchmark.py"
      - "final_tec_edge_engine.py"
      - "final_tec_edge_control_center.py"
      - "final_tec_evidence_monitor.py"
      - "final_tec_evidence_monitor_ui.py"
      - "final_tec_investor_dashboard.py"
      - "final_tec_evidence.py"
      - "final_tec_evidence_review.py"
      - "tests/test_final_tec_access.py"
      - "tests/test_final_tec_published_metrics.py"
      - "tests/test_final_tec_evidence_intake.py"
      - "tests/test_final_tec_benchmark.py"
      - "tests/test_final_tec_edge_engine.py"
      - "tests/test_final_tec_edge_control_center.py"
      - "tests/test_final_tec_evidence_monitor.py"
      - "tests/test_final_tec_investor_dashboard.py"
      - "tests/test_final_tec_evidence.py"
      - "tests/test_final_tec_evidence_review.py"
      - ".github/workflows/final-tec-dashboard-checks.yml"

permissions:
  contents: read

jobs:
  dashboard-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Run focused FINAL TEC tests
        run: python -m pytest -q tests/test_final_tec_access.py tests/test_final_tec_published_metrics.py tests/test_final_tec_evidence_intake.py tests/test_final_tec_benchmark.py tests/test_final_tec_edge_engine.py tests/test_final_tec_edge_control_center.py tests/test_final_tec_evidence_monitor.py tests/test_final_tec_investor_dashboard.py tests/test_final_tec_evidence.py tests/test_final_tec_evidence_review.py
      - name: Compile guarded application modules
        run: python -m py_compile app.py final_tec_access.py final_tec_evidence_intake.py final_tec_benchmark.py final_tec_edge_engine.py final_tec_edge_control_center.py final_tec_evidence_monitor.py final_tec_evidence_monitor_ui.py final_tec_investor_dashboard.py final_tec_evidence.py final_tec_evidence_review.py
