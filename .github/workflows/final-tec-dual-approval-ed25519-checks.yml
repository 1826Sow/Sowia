name: FINAL TEC dual approval Ed25519 checks

on:
  pull_request:
    branches:
      - feature/final-tec-dual-approval-engine
    paths:
      - "final_tec_dual_approval.py"
      - "final_tec_dual_approval_ed25519.py"
      - "final_tec_ed25519_verifier.py"
      - "tests/test_final_tec_dual_approval.py"
      - "tests/test_final_tec_dual_approval_ed25519.py"
      - ".github/workflows/final-tec-dual-approval-ed25519-checks.yml"

permissions:
  contents: read

jobs:
  dual-approval-ed25519:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "cryptography>=44,<47" "rfc8785>=0.1.4,<1" pytest
      - run: python -m pytest -q tests/test_final_tec_dual_approval.py tests/test_final_tec_dual_approval_ed25519.py
