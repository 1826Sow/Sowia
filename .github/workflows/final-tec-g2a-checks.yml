name: FINAL TEC G2-A static isolation policy checks

on:
  pull_request:
    branches:
      - feature/final-tec-g1-offline-fixtures
    paths:
      - "final_tec_g2_policy.py"
      - "tests/test_final_tec_g2_policy.py"
      - "docs/FINAL_TEC_G2A_STATIC_POLICY.md"
      - ".github/workflows/final-tec-g2a-checks.yml"

permissions:
  contents: read

jobs:
  g2a-static-policy:
    name: G2-A static policy validation only
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest
      - name: Compile policy module
        run: python -m py_compile final_tec_g2_policy.py
      - name: Run static policy tests
        run: python -m pytest -q tests/test_final_tec_g2_policy.py
