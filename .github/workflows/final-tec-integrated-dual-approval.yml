name: FINAL TEC integrated dual approval checks

on:
  pull_request:
    branches:
      - main
    paths:
      - "final_tec_dual_approval.py"
      - "final_tec_atomic_approval_store.py"
      - "final_tec_ed25519_verifier.py"
      - "final_tec_dual_approval_ed25519.py"
      - "final_tec_oidc_identity.py"
      - "final_tec_provider_contracts.py"
      - "final_tec_adapter_conformance.py"
      - "tests/test_final_tec_dual_approval.py"
      - "tests/test_final_tec_dual_approval_ed25519.py"
      - "tests/test_final_tec_atomic_approval_store.py"
      - "tests/test_final_tec_oidc_identity.py"
      - "tests/test_final_tec_ed25519_verifier.py"
      - "tests/test_final_tec_provider_contracts.py tests/test_final_tec_adapter_conformance.py"
      - "tests/test_final_tec_adapter_conformance.py"
      - "requirements.txt"
      - ".github/workflows/final-tec-integrated-dual-approval.yml"

permissions:
  contents: read

jobs:
  integrated-dual-approval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "cryptography>=44,<47" "rfc8785>=0.1.4,<1" "PyJWT[crypto]>=2.10,<3" pytest
      - run: python -m pytest -q tests/test_final_tec_dual_approval.py tests/test_final_tec_dual_approval_ed25519.py tests/test_final_tec_atomic_approval_store.py tests/test_final_tec_oidc_identity.py tests/test_final_tec_ed25519_verifier.py tests/test_final_tec_provider_contracts.py
