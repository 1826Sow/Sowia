name: FINAL TEC integrated dual approval checks

on:
  pull_request:
    branches:
      - main
    paths:
      - "final_tec_dual_approval.py"
      - "final_tec_atomic_approval_store.py"
      - "final_tec_ed25519_verifier.py"
      - "final_tec_dual_approval_ed25519.py"
      - "final_tec_oidc_identity.py"
      - "final_tec_jwks.py"
      - "final_tec_provider_contracts.py"
      - "final_tec_adapter_conformance.py"
      - "final_tec_audit_anchor.py"
      - "tests/test_final_tec_dual_approval.py"
      - "tests/test_final_tec_dual_approval_ed25519.py"
      - "tests/test_final_tec_atomic_approval_store.py"
      - "tests/test_final_tec_oidc_identity.py"
      - "tests/test_final_tec_jwks.py"
      - "tests/test_final_tec_ed25519_verifier.py"
      - "tests/test_final_tec_provider_contracts.py"
      - "tests/test_final_tec_adapter_conformance.py"
      - "tests/test_final_tec_audit_anchor.py"
      - "requirements.txt"
      - ".github/workflows/final-tec-integrated-dual-approval.yml"

permissions:
  contents: read

jobs:
  integrated-dual-approval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned lock tooling
        run: |
          python -m pip install "pip==26.3" "pip-tools==7.6.2"
      - name: Compile Python 3.12 hash lock
        run: |
          pip-compile --resolver=backtracking --generate-hashes --output-file=/tmp/final-tec-requirements-py312.lock requirements.txt
      - name: Install FINAL TEC test environment from hash lock
        run: |
          python -m venv /tmp/final-tec-py312-venv
          /tmp/final-tec-py312-venv/bin/python -m pip install "pip==26.3"
          /tmp/final-tec-py312-venv/bin/python -m pip install --require-hashes --requirement /tmp/final-tec-requirements-py312.lock
          /tmp/final-tec-py312-venv/bin/python -m pip check
      - name: Run integrated dual-approval tests in locked environment
        run: |
          /tmp/final-tec-py312-venv/bin/python -m pytest -q tests/test_final_tec_dual_approval.py tests/test_final_tec_dual_approval_ed25519.py tests/test_final_tec_atomic_approval_store.py tests/test_final_tec_oidc_identity.py tests/test_final_tec_jwks.py tests/test_final_tec_ed25519_verifier.py tests/test_final_tec_provider_contracts.py tests/test_final_tec_adapter_conformance.py tests/test_final_tec_audit_anchor.py
