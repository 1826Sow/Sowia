name: FINAL TEC nonce-validator integration checks

on:
  pull_request:
    branches:
      - feature/final-tec-local-nonce-registry
    paths:
      - "final_tec_authorization_contract.py"
      - "final_tec_nonce_registry.py"
      - "tests/test_final_tec_authorization_nonce_integration.py"
      - "tests/test_final_tec_nonce_registry.py"
      - ".github/workflows/final-tec-nonce-registry-checks.yml"

permissions:
  contents: read

jobs:
  nonce-validator-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q tests/test_final_tec_nonce_registry.py tests/test_final_tec_authorization_nonce_integration.py
