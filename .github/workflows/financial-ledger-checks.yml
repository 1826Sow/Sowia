name: SOWIA financial ledger checks

on:
  push:
    branches: [main]
    paths:
      - "financial_ledger.py"
      - "financial_reporting.py"
      - "paypal_payments.py"
      - "supabase/migrations/**"
      - "supabase_crypto_payments.sql"
      - "tests/test_financial_ledger.py"
      - "tests/test_financial_reporting.py"
      - "tests/test_paypal_payments.py"
      - ".github/workflows/financial-ledger-checks.yml"
  pull_request:
    branches: [main]
    paths:
      - "financial_ledger.py"
      - "financial_reporting.py"
      - "paypal_payments.py"
      - "supabase/migrations/**"
      - "supabase_crypto_payments.sql"
      - "tests/test_financial_ledger.py"
      - "tests/test_financial_reporting.py"
      - "tests/test_paypal_payments.py"
      - ".github/workflows/financial-ledger-checks.yml"

permissions:
  contents: read

jobs:
  financial-ledger-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest requests streamlit
      - name: Run financial and PayPal safety tests
        run: >-
          python -m pytest -q
          tests/test_financial_ledger.py
          tests/test_financial_reporting.py
          tests/test_paypal_payments.py
