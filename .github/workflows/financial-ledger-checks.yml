name: SOWIA financial ledger checks

on:
  push:
    branches: [main]
    paths:
      - "financial_ledger.py"
      - "financial_reporting.py"
      - "paypal_payments.py"
      - "supabase/migrations/**"
      - "supabase_crypto_payments.sql"
      - "tests/test_financial_ledger.py"
      - "tests/test_financial_reporting.py"
      - "tests/test_paypal_payments.py"
      - ".github/workflows/financial-ledger-checks.yml"
  pull_request:
    branches: [main]
    paths:
      - "financial_ledger.py"
      - "financial_reporting.py"
      - "paypal_payments.py"
      - "supabase/migrations/**"
      - "supabase_crypto_payments.sql"
      - "tests/test_financial_ledger.py"
      - "tests/test_financial_reporting.py"
      - "tests/test_paypal_payments.py"
      - ".github/workflows/financial-ledger-checks.yml"

permissions:
  contents: read

jobs:
  financial-ledger-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest requests streamlit
      - name: Run financial and PayPal safety tests
        run: >-
          python -m pytest -q
          tests/test_financial_ledger.py
          tests/test_financial_reporting.py
          tests/test_paypal_payments.py
