name: Generate SOW IA Android upload keystore

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/generate-android-keystore.yml"

permissions:
  contents: read
  actions: write

jobs:
  generate-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate private JKS keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signing-output
          STORE_PASSWORD="$(openssl rand -hex 24)"
          KEY_PASSWORD="$STORE_PASSWORD"
          keytool -genkeypair -v \
            -keystore signing-output/sowia-upload.jks \
            -storetype JKS \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 9125 \
            -dname "CN=SOW IA, OU=Android, O=Sowkeys, L=France, C=FR"
          keytool -list -v \
            -keystore signing-output/sowia-upload.jks \
            -storepass "$STORE_PASSWORD" \
            -alias upload
          base64 -w 0 signing-output/sowia-upload.jks > signing-output/ANDROID_KEYSTORE_BASE64.txt
          cat > signing-output/KEYSTORE_CREDENTIALS.txt <<EOF
          KEYSTORE_PASSWORD=$STORE_PASSWORD
          KEY_ALIAS=upload
          KEY_PASSWORD=$KEY_PASSWORD
          EOF
          chmod 600 signing-output/*

      - name: Install secret encryption dependency
        run: python -m pip install --disable-pip-version-check pynacl

      - name: Save signing material directly to GitHub Actions secrets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path
          from nacl.public import PublicKey, SealedBox

          root = Path("signing-output")
          credentials = {}
          for line in (root / "KEYSTORE_CREDENTIALS.txt").read_text().splitlines():
              name, value = line.split("=", 1)
              credentials[name] = value

          secrets_to_set = {
              "ANDROID_KEYSTORE_BASE64": (root / "ANDROID_KEYSTORE_BASE64.txt").read_text().strip(),
              "ANDROID_KEYSTORE_PASSWORD": credentials["KEYSTORE_PASSWORD"],
              "ANDROID_KEY_ALIAS": credentials["KEY_ALIAS"],
              "ANDROID_KEY_PASSWORD": credentials["KEY_PASSWORD"],
          }

          api = "https://api.github.com"
          repository = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]

          def request(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  url, data=data, method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  body = response.read()
                  return json.loads(body) if body else {}

          key = request("GET", f"{api}/repos/{repository}/actions/secrets/public-key")
          public_key = PublicKey(base64.b64decode(key["key"]))
          box = SealedBox(public_key)

          for name, value in secrets_to_set.items():
              encrypted = base64.b64encode(box.encrypt(value.encode())).decode()
              request("PUT", f"{api}/repos/{repository}/actions/secrets/{name}", {
                  "encrypted_value": encrypted,
                  "key_id": key["key_id"],
              })
              print(f"Saved repository secret: {name}")

          print("All four Android signing secrets were saved successfully.")
          PY

      - name: Package keystore and credentials
        uses: actions/upload-artifact@v4
        with:
          name: sowia-android-signing-material
          path: signing-output/
          retention-days: 7
          if-no-files-found: error
