name: PayPal subscription safety checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "app.py"
      - "paypal_subscriptions.py"
      - "premium_access.py"
      - "supabase/**"
      - "tests/test_paypal_subscriptions.py"
      - "tests/test_premium_admin_client_lazy.py"
      - "tests/test_premium_subscription_access.py"
      - "requirements.txt"
      - "requirements.lock"
      - ".github/workflows/paypal-subscriptions-checks.yml"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest requests streamlit
      - name: Run PayPal subscription tests
        run: python -m pytest -q tests/test_paypal_subscriptions.py tests/test_premium_subscription_access.py tests/test_premium_admin_client_lazy.py tests/test_paypal_webhook_ordering.py


  database-behavior-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sowia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sowia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Prepare isolated PayPal schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d sowia_test -v ON_ERROR_STOP=1 -f tests/sql/paypal_webhook_event_ordering_setup.sql
      - name: Apply PayPal chronology migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d sowia_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261116150000_paypal_block_event_chronology.sql
      - name: Verify PayPal webhook event ordering
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d sowia_test -v ON_ERROR_STOP=1 -f tests/sql/paypal_webhook_event_ordering.sql

  edge-function-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: denoland/setup-deno@4606d5cc6fb3f673efd4f594850e3f4b3e9d29cd # v2.0.0
        with:
          deno-version: 2.9.8
      - name: Format and parse function
        run: deno fmt supabase/functions/paypal-webhook/index.ts
      - name: Type check
        run: deno check supabase/functions/paypal-webhook/index.ts
