name: PayPal subscription safety checks

on:
  pull_request:
    branches: [main]
    paths:
      - "paypal_subscriptions.py"
      - "premium_access.py"
      - "supabase/**"
      - "tests/test_paypal_subscriptions.py"
      - "tests/test_premium_subscription_access.py"
      - ".github/workflows/paypal-subscriptions-checks.yml"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest requests streamlit
      - name: Run PayPal subscription tests
        run: python -m pytest -q tests/test_paypal_subscriptions.py tests/test_premium_subscription_access.py

  edge-function-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Format check
        run: deno fmt --check supabase/functions/paypal-webhook/index.ts
      - name: Type check
        run: deno check supabase/functions/paypal-webhook/index.ts
