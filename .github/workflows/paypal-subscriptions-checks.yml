name: PayPal subscription safety checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "app.py"
      - "paypal_subscriptions.py"
      - "premium_access.py"
      - "supabase/**"
      - "tests/test_paypal_subscriptions.py"
      - "tests/test_premium_admin_client_lazy.py"
      - "tests/test_premium_subscription_access.py"
      - "requirements.txt"
      - "requirements.lock"
      - ".github/workflows/paypal-subscriptions-checks.yml"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest requests streamlit
      - name: Run PayPal subscription tests
        run: python -m pytest -q tests/test_paypal_subscriptions.py tests/test_premium_subscription_access.py tests/test_premium_admin_client_lazy.py

  edge-function-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@4606d5cc6fb3f673efd4f594850e3f4b3e9d29cd # v2.0.0
        with:
          deno-version: 2.9.8
      - name: Format and parse function
        run: deno fmt supabase/functions/paypal-webhook/index.ts
      - name: Type check
        run: deno check supabase/functions/paypal-webhook/index.ts
