name: Tests PKCE SOW IA

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/pkce-persistence]

jobs:
  pkce-storage-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Exécuter les tests PKCE
        run: pytest -q tests/test_supabase_oauth_storage.py
