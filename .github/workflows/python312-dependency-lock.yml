name: SOWIA Python 3.12 dependency lock candidate

on:
  pull_request:
    branches: [main]
    paths:
      - "requirements.txt"
      - ".github/workflows/python312-dependency-lock.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-python312-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install pinned lock compiler
        run: |
          python -m pip install "pip==26.3"
          python -m pip install "pip-tools==7.6.2"
          python -m pip --version
          pip-compile --version
      - name: Compile hash-locked Python 3.12 dependencies
        run: |
          pip-compile \
            --resolver=backtracking \
            --generate-hashes \
            --output-file=requirements-py312-hashes.lock \
            requirements.txt
      - name: Verify lock is installable with hashes
        run: |
          python -m venv /tmp/sowia-py312-lock-venv
          /tmp/sowia-py312-lock-venv/bin/python -m pip install "pip==26.3"
          /tmp/sowia-py312-lock-venv/bin/python -m pip install \
            --require-hashes \
            --requirement requirements-py312-hashes.lock
          /tmp/sowia-py312-lock-venv/bin/python -m pip check
      - name: Upload Python 3.12 lock candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sowia-python312-hashes-lock-candidate
          path: requirements-py312-hashes.lock
          if-no-files-found: error
          retention-days: 7
