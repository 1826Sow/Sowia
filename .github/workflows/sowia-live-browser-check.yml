name: SOW IA live browser verification

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sowia-live-browser-check.yml"
      - "app.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test tools
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify the deployed SOW IA page without browser-side fixes
        run: |
          mkdir -p artifacts
          cat > browser-check.mjs <<'NODE'
          import { chromium } from "playwright";
          import fs from "node:fs/promises";
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
          const errors = { console: [], page: [], failedRequests: [], badResponses: [] };
          page.on("console", m => { if (m.type() === "error") errors.console.push(m.text()); });
          page.on("pageerror", e => errors.page.push(String(e)));
          page.on("requestfailed", r => errors.failedRequests.push({ url: r.url(), error: r.failure()?.errorText || "unknown" }));
          page.on("response", r => { if (r.status() >= 400) errors.badResponses.push({ status: r.status(), url: r.url() }); });
          let navigationError = null;
          try {
            await page.goto("https://sowia.onrender.com/", { waitUntil: "domcontentloaded", timeout: 120000 });
            await page.getByText("Connexion à SOW IA", { exact: false }).first().waitFor({ state: "visible", timeout: 90000 });
            await page.waitForTimeout(3000);
          } catch (e) { navigationError = String(e); }
          const body = await page.locator("body").innerText().catch(() => "");
          const state = await page.evaluate(() => {
            const measure = s => {
              const e=document.querySelector(s); if(!e)return null;
              const c=getComputedStyle(e),r=e.getBoundingClientRect();
              return {height:r.height,minHeight:c.minHeight,display:c.display,visibility:c.visibility,opacity:c.opacity,background:c.backgroundColor};
            };
            return {body:measure("body"),root:measure("#root"),stApp:measure(".stApp"),appView:measure('[data-testid="stAppViewContainer"]'),main:measure('[data-testid="stMain"]'),visibleInputs:[...document.querySelectorAll("input")].filter(e=>e.getBoundingClientRect().width>0&&e.getBoundingClientRect().height>0).length};
          }).catch(e=>({error:String(e)}));
          const result={url:"https://sowia.onrender.com/",title:await page.title().catch(()=>""),navigationError,loginTextVisible:body.includes("Connexion à SOW IA"),bodyPreview:body.slice(0,2500),state,errors};
          await page.screenshot({path:"artifacts/sowia-render-live.png",fullPage:true}).catch(()=>{});
          await fs.writeFile("artifacts/sowia-render-live.json",JSON.stringify(result,null,2));
          console.log("SOWIA_LIVE_RESULT="+JSON.stringify(result,null,2));
          const ok=result.loginTextVisible && state.root?.height>0 && state.stApp?.height>0 && state.visibleInputs>=2 && errors.badResponses.every(x=>x.status<500);
          if(!ok){console.error("ÉCHEC: le rendu réel de SOW IA reste incomplet.");process.exitCode=1;}
          else console.log("SUCCÈS: SOW IA affiche son écran de connexion et ses champs dans un navigateur réel, sans correctif injecté.");
          await browser.close();
          NODE
          node browser-check.mjs
      - name: Upload screenshot and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sowia-render-live-verification
          path: artifacts/
          if-no-files-found: warn
