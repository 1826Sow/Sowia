name: SOW IA quality checks

on:
  push:
    branches: [main, "feat/**", "fix/**", "security/**", "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q .
      - name: Run automated tests
        run: pytest -q

  supabase-rls-integration:
    name: Supabase real-account RLS tests
    runs-on: ubuntu-latest
    env:
      SOWIA_TEST_SUPABASE_URL: ${{ secrets.SOWIA_TEST_SUPABASE_URL }}
      SOWIA_TEST_SUPABASE_ANON_KEY: ${{ secrets.SOWIA_TEST_SUPABASE_ANON_KEY }}
      SOWIA_TEST_USER_A_EMAIL: ${{ secrets.SOWIA_TEST_USER_A_EMAIL }}
      SOWIA_TEST_USER_A_PASSWORD: ${{ secrets.SOWIA_TEST_USER_A_PASSWORD }}
      SOWIA_TEST_USER_B_EMAIL: ${{ secrets.SOWIA_TEST_USER_B_EMAIL }}
      SOWIA_TEST_USER_B_PASSWORD: ${{ secrets.SOWIA_TEST_USER_B_PASSWORD }}
    steps:
      - name: Check integration-test configuration
        id: credentials
        shell: bash
        run: |
          if [[ -n "$SOWIA_TEST_SUPABASE_URL" &&
                -n "$SOWIA_TEST_SUPABASE_ANON_KEY" &&
                -n "$SOWIA_TEST_USER_A_EMAIL" &&
                -n "$SOWIA_TEST_USER_A_PASSWORD" &&
                -n "$SOWIA_TEST_USER_B_EMAIL" &&
                -n "$SOWIA_TEST_USER_B_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Report safely that live RLS tests are not configured
        if: steps.credentials.outputs.configured != 'true'
        run: |
          echo "Live Supabase RLS tests skipped: configure the six dedicated test-project secrets described in tests/integration/README.md."
      - name: Check out repository
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/checkout@v4
      - name: Set up Python
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install integration-test dependencies
        if: steps.credentials.outputs.configured == 'true'
        run: python -m pip install --upgrade pytest requests
      - name: Verify real two-user RLS isolation
        if: steps.credentials.outputs.configured == 'true'
        run: >-
          pytest -q tests/integration/test_supabase_two_user_isolation.py tests/integration/test_supabase_storage_two_user_isolation.py
