name: SOW IA quality checks

on:
  workflow_dispatch:
  push:
    branches: [main, "feat/**", "fix/**", "security/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Prepare pinned dependency-lock tooling
        run: |
          python -m pip install "pip==26.3" "pip-tools==7.6.2"
      - name: Audit resolved Python dependencies
        run: |
          python -m pip install --upgrade pip-audit
          pip-audit -r requirements.lock
      - name: Regenerate and verify hashed dependency lock
        run: |
          pip-compile --resolver=backtracking --generate-hashes --output-file=requirements-hashes.lock requirements.lock
          python - <<'PY'
          from pathlib import Path

          def pins(path):
              found = set()
              for line in Path(path).read_text().splitlines():
                  parts = line.split("==", 1)
                  if len(parts) == 2:
                      version = parts[1].strip().split()[0].rstrip(chr(92))
                      found.add((parts[0].lower().replace("_", "-"), version))
              return found

          committed = pins("requirements.lock")
          resolved = pins("requirements-hashes.lock")
          if not committed or committed != resolved:
              raise SystemExit(f"Lock mismatch; missing={sorted(resolved - committed)}; stale_or_extra={sorted(committed - resolved)}")
          print(f"Verified {len(committed)} exact dependency pins against pip-compile output")
          PY
      - name: Install test environment from generated hash lock
        run: |
          python -m venv /tmp/sowia-lock-venv
          /tmp/sowia-lock-venv/bin/python -m pip install "pip==26.3"
          /tmp/sowia-lock-venv/bin/python -m pip install --require-hashes --requirement requirements-hashes.lock
          /tmp/sowia-lock-venv/bin/python -m pip check
      - name: Upload generated hash-verified dependency lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sowia-python-hashed-dependency-lock
          path: requirements-hashes.lock
          if-no-files-found: error
          retention-days: 7
      - name: Check Python syntax in locked environment
        run: /tmp/sowia-lock-venv/bin/python -m compileall -q .
      - name: Run automated tests in locked environment
        run: /tmp/sowia-lock-venv/bin/python -m pytest -q -rs

  supabase-rls-integration:
    name: Supabase real-account RLS tests
    timeout-minutes: 15
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/security/hardening-clean')
    runs-on: ubuntu-latest
    env:
      SOWIA_TEST_SUPABASE_URL: ${{ secrets.SOWIA_TEST_SUPABASE_URL }}
      SOWIA_TEST_SUPABASE_ANON_KEY: ${{ secrets.SOWIA_TEST_SUPABASE_ANON_KEY }}
      SOWIA_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SOWIA_TEST_SUPABASE_SERVICE_ROLE_KEY }}
      SOWIA_TEST_USER_A_EMAIL: ${{ secrets.SOWIA_TEST_USER_A_EMAIL }}
      SOWIA_TEST_USER_A_PASSWORD: ${{ secrets.SOWIA_TEST_USER_A_PASSWORD }}
      SOWIA_TEST_USER_B_EMAIL: ${{ secrets.SOWIA_TEST_USER_B_EMAIL }}
      SOWIA_TEST_USER_B_PASSWORD: ${{ secrets.SOWIA_TEST_USER_B_PASSWORD }}
      SOWIA_TEST_PROJECT_CONFIRMATION: ${{ secrets.SOWIA_TEST_PROJECT_CONFIRMATION }}
    steps:
      - name: Check integration-test configuration
        id: credentials
        shell: bash
        run: |
          if [[ -n "$SOWIA_TEST_SUPABASE_URL" &&
                -n "$SOWIA_TEST_SUPABASE_ANON_KEY" &&
                -n "$SOWIA_TEST_SUPABASE_SERVICE_ROLE_KEY" &&
                -n "$SOWIA_TEST_USER_A_EMAIL" &&
                -n "$SOWIA_TEST_USER_A_PASSWORD" &&
                -n "$SOWIA_TEST_USER_B_EMAIL" &&
                -n "$SOWIA_TEST_USER_B_PASSWORD" &&
                "$SOWIA_TEST_PROJECT_CONFIRMATION" == "I_CONFIRM_THIS_IS_A_DEDICATED_SOWIA_TEST_PROJECT" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Fail closed when live RLS tests are not configured
        if: steps.credentials.outputs.configured != 'true'
        run: |
          echo "::error::Live Supabase RLS tests were not executed. Configure the dedicated test-project credentials and explicit confirmation."
          exit 1
      - name: Check out repository
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install integration-test dependencies
        if: steps.credentials.outputs.configured == 'true'
        run: python -m pip install --upgrade pytest requests
      - name: Prepare the two dedicated Supabase test accounts
        if: steps.credentials.outputs.configured == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlsplit
          import requests

          base = os.environ["SOWIA_TEST_SUPABASE_URL"].rstrip("/")
          parsed = urlsplit(base)
          if (parsed.scheme != "https" or not parsed.hostname
              or not parsed.hostname.endswith(".supabase.co")
              or parsed.username or parsed.password or parsed.port
              or parsed.query or parsed.fragment or parsed.path not in ("", "/")):
              raise SystemExit("Refusing account preparation: expected a plain hosted HTTPS Supabase project URL")
          if os.environ["SOWIA_TEST_PROJECT_CONFIRMATION"] != "I_CONFIRM_THIS_IS_A_DEDICATED_SOWIA_TEST_PROJECT":
              raise SystemExit("Refusing account preparation: dedicated-test-project confirmation is invalid")

          service = os.environ["SOWIA_TEST_SUPABASE_SERVICE_ROLE_KEY"]
          anon = os.environ["SOWIA_TEST_SUPABASE_ANON_KEY"]
          session = requests.Session()
          admin_headers = {"apikey": service, "Authorization": f"Bearer {service}", "Content-Type": "application/json"}

          def admin_request(method, path, **kwargs):
              response = session.request(method, base + path, headers=admin_headers, timeout=20, allow_redirects=False, **kwargs)
              if not response.ok:
                  raise SystemExit(f"Supabase test-account preparation failed (HTTP {response.status_code}); verify the dedicated test project and service-role secret")
              return response

          users = []
          for page in range(1, 21):
              batch = admin_request("GET", "/auth/v1/admin/users", params={"page": page, "per_page": 100}).json().get("users", [])
              users.extend(batch)
              if len(batch) < 100:
                  break

          for label in ("A", "B"):
              email = os.environ[f"SOWIA_TEST_USER_{label}_EMAIL"].strip()
              password = os.environ[f"SOWIA_TEST_USER_{label}_PASSWORD"]
              if not email or not password:
                  raise SystemExit(f"Test account {label} is missing required credentials")
              existing = next((u for u in users if (u.get("email") or "").casefold() == email.casefold()), None)
              payload = {"email": email, "password": password, "email_confirm": True}
              if existing:
                  admin_request("PUT", f"/auth/v1/admin/users/{existing['id']}", json=payload)
              else:
                  created = admin_request("POST", "/auth/v1/admin/users", json=payload).json()
                  users.append(created)
              check = session.post(
                  base + "/auth/v1/token", params={"grant_type": "password"},
                  headers={"apikey": anon, "Content-Type": "application/json"},
                  json={"email": email, "password": password}, timeout=20, allow_redirects=False,
              )
              if not check.ok:
                  raise SystemExit(f"Supabase test account {label} could not authenticate after preparation (HTTP {check.status_code})")
          if os.environ["SOWIA_TEST_USER_A_EMAIL"].casefold() == os.environ["SOWIA_TEST_USER_B_EMAIL"].casefold():
              raise SystemExit("Test accounts A and B must use different email addresses")
          print("Both dedicated Supabase test accounts were prepared and authenticated successfully.")
          PY
      - name: Verify real two-user RLS isolation
        if: steps.credentials.outputs.configured == 'true'
        run: >-
          pytest -q
          tests/integration/test_supabase_two_user_isolation.py
          tests/integration/test_supabase_storage_two_user_isolation.py
          tests/integration/test_supabase_financial_two_user_isolation.py
          tests/integration/test_supabase_professional_modules_rls.py
