name: SOW IA quality checks

on:
  push:
    branches: [main, "feat/**", "fix/**", "security/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Prepare dependency audit tooling
        run: |
          python -m pip install --upgrade pip-audit
      - name: Audit resolved Python dependencies
        run: |
          pip-audit -r requirements.txt
      - name: Verify committed exact dependency lock
        run: |
          python - <<'PY'
          from pathlib import Path
          from packaging.requirements import Requirement
          from packaging.utils import canonicalize_name
          from packaging.version import Version

          locked = {}
          for raw in Path("requirements.lock").read_text().splitlines():
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              requirement = Requirement(line)
              specifiers = list(requirement.specifier)
              exact = [item for item in specifiers if item.operator == "=="]
              if len(exact) != 1 or len(specifiers) != 1 or "*" in exact[0].version:
                  raise SystemExit(f"Non-exact or unsupported lock entry: {line}")
              name = canonicalize_name(requirement.name)
              if name in locked:
                  raise SystemExit(f"Duplicate lock entry: {name}")
              locked[name] = Version(exact[0].version)

          if not locked:
              raise SystemExit("requirements.lock contains no exact pins")

          checked = 0
          for raw in Path("requirements.txt").read_text().splitlines():
              line = raw.split("#", 1)[0].strip()
              if not line:
                  continue
              requirement = Requirement(line)
              name = canonicalize_name(requirement.name)
              version = locked.get(name)
              if version is None or version not in requirement.specifier:
                  raise SystemExit(f"Missing or incompatible exact pin for {requirement.name}: {line}")
              checked += 1

          print(f"Verified {checked} direct requirements against {len(locked)} exact locked packages")
          PY
          pip-audit -r requirements.lock
      - name: Install test environment from committed exact lock
        run: |
          python -m venv /tmp/sowia-lock-venv
          /tmp/sowia-lock-venv/bin/python -m pip install --requirement requirements.lock
          /tmp/sowia-lock-venv/bin/python -m pip check
      - name: Upload committed dependency lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sowia-python-exact-dependency-lock
          path: requirements.lock
          if-no-files-found: error
          retention-days: 7
      - name: Check Python syntax in locked environment
        run: /tmp/sowia-lock-venv/bin/python -m compileall -q .
      - name: Run automated tests in locked environment
        run: /tmp/sowia-lock-venv/bin/python -m pytest -q

  supabase-rls-integration:
    name: Supabase real-account RLS tests
    timeout-minutes: 15
    # Never expose Supabase test credentials to code from a pull request.
    # Live two-account tests run only after trusted code is pushed to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SOWIA_TEST_SUPABASE_URL: ${{ secrets.SOWIA_TEST_SUPABASE_URL }}
      SOWIA_TEST_SUPABASE_ANON_KEY: ${{ secrets.SOWIA_TEST_SUPABASE_ANON_KEY }}
      SOWIA_TEST_USER_A_EMAIL: ${{ secrets.SOWIA_TEST_USER_A_EMAIL }}
      SOWIA_TEST_USER_A_PASSWORD: ${{ secrets.SOWIA_TEST_USER_A_PASSWORD }}
      SOWIA_TEST_USER_B_EMAIL: ${{ secrets.SOWIA_TEST_USER_B_EMAIL }}
      SOWIA_TEST_USER_B_PASSWORD: ${{ secrets.SOWIA_TEST_USER_B_PASSWORD }}
      SOWIA_TEST_PROJECT_CONFIRMATION: ${{ secrets.SOWIA_TEST_PROJECT_CONFIRMATION }}
    steps:
      - name: Check integration-test configuration
        id: credentials
        shell: bash
        run: |
          if [[ -n "$SOWIA_TEST_SUPABASE_URL" &&
                -n "$SOWIA_TEST_SUPABASE_ANON_KEY" &&
                -n "$SOWIA_TEST_USER_A_EMAIL" &&
                -n "$SOWIA_TEST_USER_A_PASSWORD" &&
                -n "$SOWIA_TEST_USER_B_EMAIL" &&
                -n "$SOWIA_TEST_USER_B_PASSWORD" &&
                "$SOWIA_TEST_PROJECT_CONFIRMATION" == "I_CONFIRM_THIS_IS_A_DEDICATED_SOWIA_TEST_PROJECT" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Report safely that live RLS tests are not configured
        if: steps.credentials.outputs.configured != 'true'
        run: |
          echo "Live Supabase RLS tests skipped: configure the six dedicated test-project credentials and the explicit test-project confirmation secret described in tests/integration/README.md."
      - name: Check out repository
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install integration-test dependencies
        if: steps.credentials.outputs.configured == 'true'
        run: python -m pip install --upgrade pytest requests
      - name: Verify real two-user RLS isolation
        if: steps.credentials.outputs.configured == 'true'
        run: >-
          pytest -q tests/integration/test_supabase_two_user_isolation.py tests/integration/test_supabase_storage_two_user_isolation.py tests/integration/test_sowia_project_register_rls.py
