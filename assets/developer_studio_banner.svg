  <rect x="45" y="520" width="245" height="150" rx="24"/><rect x="315" y="520" width="245" height="150" rx="24"/><rect x="585" y="520" width="245" height="150" rx="24"/><rect x="855" y="520" width="245" height="150" rx="24"/><rect x="1125" y="520" width="230" height="150" rx="24"/>
 </g>
