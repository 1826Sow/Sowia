<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
<title id="title">SOW IA — Developer Studio</title>
<desc id="desc">Bannière futuriste bleu nuit et cyan avec un globe terrestre lumineux, des orbites dorées et les outils du Developer Studio. Aucun personnage.</desc>
<defs>
 <radialGradient id="bg"><stop stop-color="#073d91"/><stop offset=".58" stop-color="#031b50"/><stop offset="1" stop-color="#010824"/></radialGradient>
 <radialGradient id="earth" cx="36%" cy="28%"><stop stop-color="#e7fbff"/><stop offset=".18" stop-color="#58d8ff"/><stop offset=".52" stop-color="#0872df"/><stop offset="1" stop-color="#031a59"/></radialGradient>
 <linearGradient id="cyan"><stop stop-color="#a8f7ff"/><stop offset=".45" stop-color="#10cfff"/><stop offset="1" stop-color="#0874ff"/></linearGradient>
 <linearGradient id="gold"><stop stop-color="#fff4ad"/><stop offset=".5" stop-color="#ffbf27"/><stop offset="1" stop-color="#d97800"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <clipPath id="earthClip"><circle cx="300" cy="320" r="245"/></clipPath>
</defs>
